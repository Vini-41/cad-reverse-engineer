# One config for every Python file in the repo, so ruff gives the same answer from any directory.
line-length = 100
target-version = "py312"  # the oldest Python the tool's requires-python allows
extend-exclude = [".claude"]

[format]
# Code blocks in the reference docs keep their hand-aligned comments; examples/legclaw,
# examples/centrifuge, examples/cell-stretcher and examples/compact-sspg keep the code their dogfood
# runs wrote, as the runs left it.
exclude = [
  "*.md", "examples/legclaw/*.py", "examples/centrifuge/*.py", "examples/cell-stretcher/*.py",
  "examples/compact-sspg/*.py",
]

[lint]
# pyflakes and pycodestyle errors, lines over line-length (ruff format leaves long strings,
# docstrings and comments), blind excepts (each one carries a noqa with its reason), and idioms
# target-version has outgrown.
select = ["E4", "E7", "E9", "F", "BLE", "UP", "E501", "TID251"]

# The tests drive the tool as an agent does, through its CLI, so its modules stay free to change:
# `from cadrev import cli` is their one import of it, marked noqa.
[lint.flake8-tidy-imports.banned-api]
"cadrev".msg = "tests import only cadrev.cli"

[lint.per-file-ignores]
"!tests/**" = ["TID251"]
# A project's model.py takes build123d whole, as the template and the modeling reference show.
"**/model.py" = ["F403", "F405"]
# examples/legclaw, examples/centrifuge, examples/cell-stretcher and examples/compact-sspg keep the
# code their dogfood runs wrote, long lines included, and compact-sspg its statements joined by
# semicolons and one unused name.
"examples/legclaw/*.py" = ["E501"]
"examples/centrifuge/*.py" = ["E501"]
"examples/cell-stretcher/*.py" = ["E501"]
"examples/compact-sspg/*.py" = ["E501", "E702", "F841"]
