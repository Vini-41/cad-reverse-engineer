# One config for every Python file in the repo, so ruff gives the same answer from any directory.
line-length = 100
# Extensionless Python scripts; a new shell script in scripts/ joins red-on-main, cadrev and check here.
extend-include = ["scripts/*"]
extend-exclude = ["scripts/red-on-main", "scripts/cadrev", "scripts/check", ".claude"]

[format]
# Code blocks in the reference docs keep their hand-aligned comments; examples/legclaw keeps the
# code its dogfood run wrote, as the run left it.
exclude = ["*.md", "examples/legclaw/*.py"]

[lint]
# pyflakes and pycodestyle errors, blind excepts (each one carries a noqa with its reason), and
# syntax the oldest Python in requires-python cannot parse.
select = ["E4", "E7", "E9", "F", "BLE", "UP"]

[lint.per-file-ignores]
# A project's model.py takes build123d whole, as the template and the modeling reference show.
"**/model.py" = ["F403", "F405"]
