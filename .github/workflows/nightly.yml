name: nightly
# The examples too slow for every push, each marked `Checked: nightly` in its README
# (scripts/check --nightly); workflow_dispatch runs them on demand.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  examples:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/cad-reverse-engineer/tool
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked -p 3.12 --extra test
      - run: ../../../scripts/check --nightly
