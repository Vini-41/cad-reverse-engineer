name: test
# workflow_dispatch reruns a commit whose push event was lost (scripts/ci-wait names the command).
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/cad-reverse-engineer/tool
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # red-on-main compares against the commit the change replaces
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked -p 3.12 --extra test
      - run: npm install -g @anthropic-ai/claude-code  # for scripts/check's plugin validation
      - run: ../../../scripts/check
        env:
          # A PR's checkout is its merge commit, whose first parent is the base it merges into; a
          # rerun by hand compares against the commit's own parent.
          BASE: ${{ github.event_name != 'push' && 'HEAD^1' || github.event.before }}
