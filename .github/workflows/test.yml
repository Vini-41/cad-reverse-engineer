name: test
# workflow_dispatch reruns a commit whose push event was lost (scripts/ci-wait names the command).
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The ends of pyproject's requires-python, and the runner's own 3.12: uv picks the system
      # interpreter where one matches, an early patch that caught an argparse bug a newer one hides.
      matrix:
        python: ["3.10", "3.12", "3.13"]
    defaults:
      run:
        working-directory: skills/cad-reverse-engineer/tool
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # red-on-main compares against the commit the change replaces
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked -p ${{ matrix.python }} --extra test
      - run: npm install -g @anthropic-ai/claude-code  # for scripts/check's plugin validation
      - run: ../../../scripts/check
        env:
          # A PR's checkout is its merge commit, whose first parent is the base it merges into; a
          # rerun by hand compares against the commit's own parent.
          BASE: ${{ github.event_name != 'push' && 'HEAD^1' || github.event.before }}
          # A PR's head, past GitHub's merge of it, for scripts/check-linear.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
