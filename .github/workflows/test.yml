name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/cad-reverse-engineer/tool
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # red-on-main compares against the commit the change replaces
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked -p 3.12 --extra test
      - run: npm install -g @anthropic-ai/claude-code  # for scripts/check's plugin validation
      - run: ../../../scripts/check
        env:
          # A PR's checkout is its merge commit, whose first parent is the base it merges into.
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
