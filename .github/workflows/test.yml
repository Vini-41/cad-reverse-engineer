name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/cad-reverse-engineer/tool
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # red-on-main compares against HEAD~1
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked -p 3.12 --extra test
      - run: npm install -g @anthropic-ai/claude-code  # for scripts/check's plugin validation
      - run: ../../../scripts/check
