# Reconstruction project. File formats: references/project-format.md in the cad-reverse-engineer skill.
format: 1   # version of these file formats; set by cadrev init
name: cell-stretcher
target: "Six-well uniaxial cell stretcher of Kah et al. 2021 (HardwareX 9, e00162) as released in its design files: the stretcher unit (aluminium frame, two lead-screw actuators, carriage, stationary bar, substrate mountings with the 3D-printed clamps, the stretch-holding frames of Acryl6MM) and the PDMS casting mould (Acryl3MM base, platform and parts, MoldFrame), at zero stretch with clamps fitted; the electronics and controller unit is not built"
units: {length: mm, angle: deg, mass: g}
tolerance: {length: 0.001, angle: 0.01}   # model must realise source values to this; it is not a print tolerance
