# Reconstruction project. File formats: references/project-format.md in the build-model skill.
format: 2   # version of these file formats; set by cadrev init
name: "run-53"
target: >-
  Six-well uniaxial cell stretcher of Kah et al. 2021 (HardwareX 9, e00162) as released on Mendeley Data
  (doi:10.17632/mgkbmytx63.1): the stretcher unit, its carriage driven by two lead screws and standing at zero
  stretch, with the twelve 3D-printed clamps on its hooks (not the hooks-only mounting) and the narrow and wide
  holding frames its 6 mm sheet cuts, built but not mounted; and one casting mould for the PDMS substrates, with
  the released 3.5 mm frame. Not the electronics and controller unit, the PDMS substrates or the wiring.
units: {length: mm, angle: deg, mass: g}
material: "acrylic glass, laser cut from 6 mm and 3 mm sheet; the clamps and the mould frame 3D printed"
follows: design
# how closely the model realises a source value; no shop works to it. 0.005 because the cut sheets were drawn by
# hand: their round numbers scatter by up to 0.0035 mm (a hole's centre and diameter, an arc's centre), which a
# model built from the design values cannot follow more closely
tolerance: {length: 0.005}
