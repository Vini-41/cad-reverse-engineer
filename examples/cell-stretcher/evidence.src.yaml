# Places where sources disagree, and how the reconstruction resolves each.
conflicts:
  - id: K-env
    evidence: [E-env, E-prof-long, E-feet]
    summary: "The paper gives the assembled stretcher as 47 x 42 x 11 cm (w x d x h). Built from the 440 mm profiles, the released 71 mm end plates and the 15 mm feet, the reconstruction measures about 48.5 x 40.4 x 9.5 cm (along the profiles x across x up)."
    resolution: "w and d agree within 4% once w is read along the profiles; the 15 mm height difference lies in what the overall size counts (cables, connector, motor-box overhang) and in where the motor boxes sit, which no source places (G-layout). The envelope is not checked; the profiles, plates and feet that make it up are checked from their own statements."

