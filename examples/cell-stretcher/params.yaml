  cl_pitch: {basis: source, from: P-cl-pitch.p, interpretation: "post-hole pitch, the lobes' centres"}
  cl_t: {basis: source, from: P-cl-plate.t, interpretation: "plate thickness"}
  cl_nin: {basis: source, from: P-cl-nin.w, interpretation: "notch width at the open edge, inside the wall"}
  cl_nout: {basis: source, from: P-cl-nout.w, interpretation: "wall width at the open edge, outside"}
