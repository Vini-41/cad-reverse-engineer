  ring_mid_r: {basis: derived, expr: (ring_od + straw_d) / 4, interpretation: "mid-radius of the ring, where its shape-check datums sit"}
  mf_w: {basis: source, from: P-mf-env.L, interpretation: "mould frame side"}
  mf_h: {basis: source, from: E-frame-h.h, interpretation: "mould frame height, z"}
  mf_hole_d: {basis: source, from: P-mf-hole.d, interpretation: "frame screw holes"}
  mf_hole_p: {basis: source, from: P-mf-holep.p, interpretation: "frame screw-hole pitch, both ways"}
  mf_win: {basis: source, from: P-mf-win.w, interpretation: "the square window, flat to flat"}
  mf_lobe_p: {basis: source, from: P-mf-lobep.p, interpretation: "the window's corner lobes round the posts, centre pitch"}
  mf_lobe_span: {basis: source, from: P-mf-lobespan.s, interpretation: "lobe top to lobe bottom across the window"}
  sub_t: {basis: source, from: E-frame-h.h, interpretation: "the cast substrate is as thick as the frame is tall; the clamps sit on it"}
  # ---------------------------------------------------------------- layout
  bar_y: {basis: proposed, value: 60, rationale: "stationary bar placed on the long profiles 60 mm from their far end", gap: G-layout}
  baseline: {basis: source, from: E-baseline.L, interpretation: "the substrate's post holes, stationary to mobile, at zero stretch: the 25 mm baseline"}
  kit_x: {basis: proposed, value: 450, rationale: "the frames and the mould are set beside the stretcher, not in it", gap: G-layout}
  mould_y: {basis: proposed, value: 200, rationale: "the mould beside the frames", gap: G-layout}
  # ---------------------------------------------------------------- motion
  screw_lead: {basis: source, from: E-lead.lead, interpretation: "left screw: carriage travel per screw turn, + away from the stationary bar for + motor turn"}
  screw_lead_r: {basis: source, from: E-lead.lead, interpretation: "right screw, the same Anet A8 screw"}
  stretch_max: {basis: source, from: E-T2.a, interpretation: "the carriage's travel from zero stretch, the largest amplitude Table 2 runs; the rail travel itself is not stated"}
  sweep_steps: {basis: proposed, value: 6, rationale: "sweep resolution"}
  # ---------------------------------------------------------------- mass model
  rho_pmma: {basis: proposed, value: 0.00118, rationale: "acrylic glass, 1.18 g/cm3", gap: G-mass}
  rho_al: {basis: proposed, value: 0.0027, rationale: "aluminium profile taken solid at 2.7 g/cm3 (a slotted profile weighs less)", gap: G-mass}
  rho_steel: {basis: proposed, value: 0.00785, rationale: "steel screws and rods", gap: G-mass}
  rho_pla: {basis: proposed, value: 0.00124, rationale: "printed clamps and mould frame, PLA", gap: G-mass}
  rho_rubber: {basis: proposed, value: 0.0011, rationale: "rubber feet", gap: G-mass}
  m_motor: {basis: proposed, value: 280, rationale: "a 40 mm NEMA 17 stepper", gap: G-motor}

