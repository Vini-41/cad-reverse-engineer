  # ================= threads the sources name
  mount_screw: {basis: source, thread: M4, from: P5-m4x12, length: mount_screw_len}
  mount_screw_len: {basis: source, from: P5-m4x12.L, interpretation: "through a mounting's 6 mm and the 6 mm of the bar or the carriage plate under it"}
  frame_bolt: {basis: source, thread: M4, from: P9-frame-bolts}
  hook_thread: {basis: source, thread: M3, from: P8-hook-bolts}
  mould_screw: {basis: source, thread: M4, from: P7-mould-posts, length: mould_screw_len}
  mould_screw_len: {basis: proposed, value: 6, rationale: "M4 x 6, the standard length that passes the 3.5 mm frame and stays within the base's 3 mm, so the mould sits flat", gap: G-mould-screws}
  # ================= threads the sheets' holes imply
  m3: {basis: proposed, thread: M3, rationale: "d2.5 is the M3 tap drill and d3.1 clears M3; the paper lists an M3 tap and M3 screws", gap: G-screws}
  m5: {basis: proposed, thread: M5, rationale: "the d5 and d5.3 holes over the profiles' slots take the M5 screws of the bill of materials, into its M5 T-slot nuts; the four d6 holes of the stationary end-pieces face the long profiles' core bores, which its four M6 x 20 fit", gap: G-screws}

  # ================= what the paper states of the bought parts and of the motion
  prof_a: {basis: source, from: P4-profile-short.a, interpretation: "the profile's height as it lies: Fig. 2E shows two slots on its underside"}
  prof_b: {basis: source, from: P4-profile-short.b, interpretation: "the profile's width as it lies"}
  prof_short_len: {basis: source, from: P4-profile-short.L}
  prof_long_len: {basis: source, from: P4-profile-long.L}
  foot_d: {basis: source, from: P4-feet.size, interpretation: "read as the foot's diameter: the feet of Fig. 2E are about that wide"}
  post_d: {basis: source, from: P7-mould-posts.d}
  baseline: {basis: source, from: P11-baseline-hooks.L, interpretation: "between the hooks of the stationary and of the mobile mounting at zero stretch, where the assembly is built"}
  screw_lead: {basis: source, from: P11-lead.lead, interpretation: "carriage travel per turn of a lead screw; the paper calls it the pitch"}
  stroke: {basis: source, from: P12-stroke.amplitude, interpretation: "the largest stretch amplitude the paper ran (Table 2), a travel the carriage must reach; not its travel to the limit switch"}
  stroke_turn: {basis: derived, expr: stroke / screw_lead * 360, value: 1125, interpretation: "turn of a screw, in degrees, that moves the carriage by the stroke"}

  # ================= proposed: the bought parts (Anet A8 kit and bill of materials), each held as its envelope
  prof_slot_w: {basis: proposed, value: 6, rationale: "the bill of materials names the slot, B-Type Nut 6: a 6 mm slot", gap: G-profile}
  prof_slot_depth: {basis: proposed, value: 6, rationale: "about the depth of a 6 mm slot in a 20 mm profile; the profile is held as its envelope with plain slots", gap: G-profile}
  rod_d: {basis: proposed, value: 8, rationale: "the Anet A8's 8 mm smooth rod, which the end-pieces' d8 holes take", gap: G-rod}
  rod_len: {basis: proposed, value: 380, rationale: "the 380 mm rod of the Anet A8 kit: Fig. 2E shows the long profiles standing about 70 mm past the motor-end short profile, where a rod of that length ends", gap: G-rod}
  screw_d: {basis: proposed, value: 8, rationale: "the Anet A8's T8 lead screw, which the end plate's d8 holes take", gap: G-leadscrew}
  screw_len: {basis: proposed, value: 345, rationale: "the Anet A8's Z-axis lead screw, T8 x 345 mm", gap: G-leadscrew}
  nut_flange_d: {basis: proposed, value: 22, rationale: "the brass T8 flange nut of the Anet A8: 22 mm flange", gap: G-nut}
  nut_flange_t: {basis: proposed, value: 3.5, rationale: "its flange, 3.5 mm thick", gap: G-nut}
  nut_body_d: {basis: proposed, value: 10.2, rationale: "its 10.2 mm body, which the wall's d11 bore takes", gap: G-nut}
  nut_len: {basis: proposed, value: 15, rationale: "its 15 mm overall length, held with the flange at one end", gap: G-nut}
  nut_hole_d: {basis: proposed, value: 3.5, rationale: "its four 3.5 mm holes on a 16 mm circle, which the wall's four M3 threads match", gap: G-nut}
  bearing_od: {basis: proposed, value: 15, rationale: "LM8LUU, the long linear bearing of the Anet A8's Z axis: 15 mm outside, in the wall's d15.2", gap: G-bearing}
  bearing_len: {basis: proposed, value: 45, rationale: "LM8LUU is 45 mm long, the carriage box's depth over both walls: one bearing a rod, held between its two retainers", gap: G-bearing}
  motor_w: {basis: proposed, value: 42, rationale: "NEMA 17 body, 42 mm square (42SHDC3025-24B)", gap: G-motor}
  motor_len: {basis: proposed, value: 40, rationale: "its 40 mm body", gap: G-motor}
  motor_boss_d: {basis: proposed, value: 22, rationale: "the NEMA 17 pilot boss, 22 mm, in the face plate's d23", gap: G-motor}
  motor_boss_h: {basis: proposed, value: 2, rationale: "the NEMA 17 pilot boss, 2 mm high", gap: G-motor}
  motor_shaft_d: {basis: proposed, value: 5, rationale: "the NEMA 17 shaft, 5 mm", gap: G-motor}
  motor_shaft_len: {basis: proposed, value: 24, rationale: "its shaft, 24 mm from the mounting face", gap: G-motor}
  motor_hole_depth: {basis: proposed, value: 4.5, rationale: "the NEMA 17 M3 mounting threads, 4.5 mm deep, on the 31 mm square the face plate's holes give", gap: G-motor}
  coup_d: {basis: proposed, value: 19, rationale: "the Anet A8's 5 to 8 mm flexible coupling, 19 mm across", gap: G-coupling}
  coup_len: {basis: proposed, value: 25, rationale: "and 25 mm long, half on the motor's shaft and half on the screw", gap: G-coupling}
  sw_len: {basis: proposed, value: 20, rationale: "a 20 mm microswitch, whose two holes are 9.5 mm apart as the plate's are", gap: G-switch}
  sw_h: {basis: proposed, value: 10, rationale: "its body, 10 mm from the plunger's face to the terminals", gap: G-switch}
  sw_t: {basis: proposed, value: 6.4, rationale: "its body, 6.4 mm thick", gap: G-switch}
  sw_hole_in: {basis: proposed, value: 2.9, rationale: "its holes, 2.9 mm from the terminals' face; the lever is left out", gap: G-switch}
  sw_hole_d: {basis: proposed, value: 2.5, rationale: "its 2.5 mm holes, for the M2.5 screws the plate's d2 holes are tapped for", gap: G-switch}
  foot_h: {basis: proposed, value: 15, rationale: "a 15 x 15 mm rubber buffer with an M5 stud, a catalogue size that fits the bill's 15 mm whether it is the diameter or the height", gap: G-foot}
  foot_thread: {basis: source, thread: M5, from: P4-feet}
  foot_stud_len: {basis: proposed, value: 10, rationale: "an M5 x 10 stud: 6 mm of corner plate and 4 mm into the slot's nut", gap: G-foot}
  hook_af: {basis: proposed, value: 5.5, rationale: "an M3 hexagonal spacer bolt, 5.5 mm across flats", gap: G-hook}
  hook_sides: {basis: proposed, value: 6, rationale: "a hexagonal spacer bolt, as Fig. 6 shows", gap: G-hook}
  hook_len: {basis: proposed, value: 10, rationale: "a 10 mm body, about what Fig. 6C shows standing on a substrate", gap: G-hook}
  hook_stud_len: {basis: proposed, value: 6, rationale: "the 6 mm stud of a catalogue M3 spacer bolt", gap: G-hook}
  post_len: {basis: proposed, value: 10, rationale: "through the 3 mm base and the 3.5 mm cavity and 3.5 mm proud of the frame, about as Fig. 1C draws the posts", gap: G-post}

  # ================= proposed: where the parts sit (each choice, and the gap that would settle it)
  rod_z: {basis: derived, expr: ep_h - ep_rod_v, value: 47, gap: G-ends, interpretation: "height of the four rod axes: the end-pieces stand with their v 71 edge on the profiles' underside line, their d6 and d5 row at the middle of the 20 mm profile, the plate with the rod holes against the profiles and its cover outside"}
  motor_end_y: {basis: derived, expr: rod_len - 2 * t6, value: 368, gap: G-frame, interpretation: "outer side of the motor-end short profile, from the long profiles' ends: the guide rods run from the outer face of the end plate to the outer face of the motor end plate, which bolts on that profile's side; the profiles lie flat, the short ones between the long ones, the stationary one flush with their ends"}
  motor_face_y: {basis: derived, expr: screw_len - t6 + motor_shaft_len, value: 363, gap: G-fixtures, interpretation: "the motor's mounting face: a lead screw runs from the end plate's outer face to the tip of the motor's shaft, the coupling half on each; the mounting frame's base is on the long profile's top slots, the motor behind it over the profile"}
  carriage_y: {basis: derived, expr: sb_wid - sb_thread_v + 2 * (mt_screw_v - mt_lobe_r) + baseline + cpl_thread_v - box_depth, value: 135.9, gap: G-carriage, interpretation: "the carriage box's face towards the stationary bar at zero stretch: the bar's threads on its inner edge, the plate's shelf towards the bar and under the box, the cover on top, so both rows of mountings lie at one height with their hooks a baseline apart"}
  clamp_lift: {basis: derived, expr: mfr_h, gap: G-clamp, interpretation: "a clamp's base lies one substrate thickness above its mounting, flat face down, under the spacer bolts' bodies, its notch towards the facing clamp"}
  travel_max: {basis: derived, expr: motor_end_y - sp_len - carriage_y - box_depth, value: 127.1, gap: G-travel, interpretation: "from zero stretch until the carriage plate meets the limit-switch plate's edge; the switch's lever, left out of the model, trips a little before"}
  screw_turn_max: {basis: derived, expr: travel_max / screw_lead * 360, interpretation: "turn of a screw over the carriage's travel, in degrees"}
  sweep_steps: {basis: proposed, value: 5, rationale: "poses across the travel at which nothing may collide", gap: G-travel}

  # ================= proposed: what the parts weigh (the kinematic model's masses; no source states one)
  rho_acrylic: {basis: proposed, value: 0.00119, rationale: "cast acrylic glass, 1.19 g/cm3", gap: G-mass}
  rho_steel: {basis: proposed, value: 0.00785, rationale: "steel rod and screw, 7.85 g/cm3, on the plain cylinder", gap: G-mass}
  rho_brass: {basis: proposed, value: 0.0085, rationale: "brass, 8.5 g/cm3", gap: G-mass}
  rho_alu: {basis: proposed, value: 0.0027, rationale: "aluminium, 2.7 g/cm3, on the coupling's envelope", gap: G-mass}
  rho_rubber: {basis: proposed, value: 0.0012, rationale: "rubber, 1.2 g/cm3", gap: G-mass}
  rho_nylon: {basis: proposed, value: 0.00114, rationale: "polyamide spacer bolt, 1.14 g/cm3", gap: G-mass}
  rho_pla: {basis: proposed, value: 0.00124, rationale: "printed PLA, 1.24 g/cm3 solid", gap: G-mass}
  rho_straw: {basis: proposed, value: 0.0009, rationale: "polypropylene straw, 0.9 g/cm3, on the plain cylinder", gap: G-mass}
  prof_lin_mass: {basis: proposed, value: 0.8, rationale: "a 20x40 slot-6 profile weighs about 0.8 kg/m", gap: G-mass}
  prof_long_mass: {basis: derived, expr: prof_lin_mass * prof_long_len}
  prof_short_mass: {basis: derived, expr: prof_lin_mass * prof_short_len}
  motor_mass: {basis: proposed, value: 280, rationale: "a 40 mm NEMA 17 stepper, about 280 g", gap: G-mass}
  bearing_mass: {basis: proposed, value: 30, rationale: "an LM8LUU, about 30 g", gap: G-mass}
  switch_mass: {basis: proposed, value: 2, rationale: "a 20 mm microswitch, about 2 g", gap: G-mass}

