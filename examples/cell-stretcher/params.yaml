  screw_u: {basis: source, from: "acryl6@195.28,558.3", value: 20, interpretation: "a lead screw's axis from the unit's side: end plate d8 and carriage wall d11"}
  guide_u: {basis: source, from: "acryl6@195.28,558.3", value: 60, interpretation: "a guide rod's axis from the unit's side: end plate d8 and carriage wall d15.2"}
  mount_hole_pitch: {basis: source, from: "acryl6@206.95,76.8", value: 20, interpretation: "pitch of the twelve M4 threads of the carriage plate and of the stationary bar, and of a mounting's two screw holes"}
  n_mount_threads: {basis: source, from: "acryl6@206.95,76.8", value: 12, interpretation: "threads in the row"}

  # ================= carriage
