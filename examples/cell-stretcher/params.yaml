  pf_w: {basis: derived, expr: sqrt(culture_area), interpretation: "the 4 cm2 culture area read as the raised platform's square, 20 x 20 mm, its rounded corners aside", gap: G-acryl3}
  culture_area: {basis: source, from: E-area.a, interpretation: "culture area per substrate, the floor of the well the platform casts"}
  pf_r: {basis: proposed, value: 5, rationale: "platform corner radius, region acryl3mm@140,475", gap: G-acryl3}
