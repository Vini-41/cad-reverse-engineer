  cl_c: {basis: derived, expr: cl_nflat / 2, interpretation: "the notch arcs' centres sit at the ends of its straight run"}
  cl_flat: {basis: proposed, value: 10, rationale: "straight back edge between the lobes, read from the STL's facet corners", gap: G-clamp}
  cl_ang: {basis: proposed, value: 45, rationale: "the side chamfers run at 45 degrees, tangent to the lobes, read from the STL", gap: G-clamp}
  # ---------------------------------------------------------------- mould
  mb_side: {basis: proposed, value: 50, rationale: "mould base side, region acryl3mm@85,570", gap: G-acryl3}
