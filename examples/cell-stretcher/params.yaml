  t6: {basis: source, from: P3-carriage.t, interpretation: "thickness of every part cut from the 6 mm sheet, and the depth of its finger joints"}
  t3: {basis: source, from: P3-mould-base.t, interpretation: "thickness of the mould's base, and of every part cut from the 3 mm sheet"}
  tab: {basis: source, from: "acryl6@206.95,76.8", value: 12, interpretation: "length of a finger-joint tab and of the gap beside it"}
  slot_edge: {basis: source, from: "acryl6@414.55,122.86", value: 10, interpretation: "a profile slot's centre from the profile's edge, where every plate bolted on a 20x40 profile has its first hole"}
  slot_pitch: {basis: source, from: "acryl6@414.55,122.86", value: 20, interpretation: "pitch of the profile slots, which every plate bolted on a profile repeats"}
  d_m5: {basis: source, from: "acryl6@414.55,122.86", value: 5, interpretation: "the d5 hole of the plates bolted on the profiles' slots"}
  d_m3_clear: {basis: source, from: "acryl6@195.28,486.51", value: 3.1, interpretation: "the d3.1 hole over a d2.5 one: end cover, bearing retainer"}
