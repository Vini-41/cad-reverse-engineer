# The only place numbers enter the model. basis: source | derived | measured | proposed.
# A cut part's numbers are in its region's frame: origin at the top-left corner of the region's box on the sheet,
# u right and v down as the sheet lies (read_bodies.py prints each). A number several plates repeat because they
# mate (a finger joint, a rod's place, the profiles' slot pitch) is one param, citing one of the regions.
params:
