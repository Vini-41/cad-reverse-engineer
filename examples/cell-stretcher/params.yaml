  post_half: {basis: proposed, value: 12.5, rationale: "straw post holes from the base centre", gap: G-acryl3}
  straw_d: {basis: source, from: E-straw.d, interpretation: "straw diameter: the posts, the base's post holes and the rings' bores"}
