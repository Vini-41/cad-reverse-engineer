  cl_L: {basis: source, from: P-cl-env.L, interpretation: "clamp length over its two lobes, x"}
  cl_W: {basis: source, from: P-cl-env.W, interpretation: "clamp depth, notch edge to lobe tops, y"}
  cl_H: {basis: source, from: P-cl-env.H, interpretation: "height of the U wall, z"}
