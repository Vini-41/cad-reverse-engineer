# Every number the sources state about the object. Each item is a verbatim quote or a pinned
# figure crop with its reading.
# The paper prints no dimension inside a figure: its figures carry scale bars only, and Fig. 5 (the
# pyStretch windows) and Fig. 6 ("0 mm Stretch", "5 mm Stretch") show settings their captions restate.
# The released geometry states no numbers here: read_bodies.py prints what each body settles.
