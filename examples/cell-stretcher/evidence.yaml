# Places where sources disagree, and how the reconstruction resolves each.
conflicts:
  - id: K1
    evidence: [P11-baseline-clamps, P11-baseline-hooks]
    summary: The paper takes a baseline of 21.5 mm with the clamps on and 25 mm between the hooks. The released Clamp.stl, a clamp on each pair of hooks 25 mm apart with its notch towards the facing clamp, leaves 18 mm between the walls' near faces and 20 mm between their far faces, and no pair of faces 21.5 mm apart.
    resolution: Built from the released clamp on hooks 25 mm apart, which the baseline-hooks check holds. The 21.5 mm is kept as context; gap G-clamp asks the authors between which faces it is measured.
  - id: K2
    evidence: [P2-envelope, P4-profile-long, P4-profile-short]
    summary: The paper states 47 x 42 x 11 cm. Built from the released sheets and the bill's profiles the unit is 452 mm along the rods (440 mm profiles and two 6 mm end-pieces), 404 mm across (390 mm plates and 7 mm of a motor mounting frame each side) and 95 mm high on 15 mm feet, 15 to 18 mm less on every axis than the stated size, which is printed to the centimetre.
    resolution: Built from the released sheets and the profile lengths, each checked. The stated envelope is kept as context. Screw heads, connectors and cables, which the model does not build, and a taller foot (gap G-foot) would make up part of the difference.
