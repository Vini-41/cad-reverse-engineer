  # ---- what the paper states, on the built model
  - {id: sheet-6mm, kind: bbox, part: carriage_wall, evidence: P3-carriage, axes: {t: z}, interpretation: "the 6 mm sheet's thickness, through a carriage wall"}
  - {id: profile-short, kind: bbox, part: profile_short, evidence: P4-profile-short, axes: {L: x, b: y, a: z}, interpretation: "20x40 read as height x width as the profile lies"}
  - {id: profile-long, kind: bbox, part: profile_long, evidence: P4-profile-long, axes: {L: x}}
  - {id: profiles-short, kind: count, part: profile_short, evidence: P4-profile-short, key: n}
  - {id: profiles-long, kind: count, part: profile_long, evidence: P4-profile-long, key: n}
  - {id: profiles-frame, kind: count, part: profile_long, expect: "P3-frame.profiles - P4-profile-short.n", interpretation: "four profiles in the frame: the two short ones and these"}
  - {id: foot-size, kind: diameter, at: foot.wall, evidence: P4-feet, key: size, interpretation: "15 mm read as the foot's diameter"}
  - {id: motors, kind: count, part: motor, evidence: P3-drive, key: motors}
  - {id: actuators, kind: count, part: lead_nut, evidence: P3-drive, key: actuators, interpretation: "a spindle-driven actuator is a lead screw with its nut: one nut each"}
  - {id: lead-screws, kind: count, part: lead_screw, evidence: P6-rods, key: lead_screws}
  - {id: guide-rods, kind: count, part: guide_rod, evidence: P6-rods, key: guide_rods}
  - {id: mount-screws, kind: count, thread: mount_screw, evidence: P5-m4x12, key: n, interpretation: "an M4 x 12 in each thread of the stationary bar and of the carriage plate"}
  - {id: hooks, kind: count, part: hook, expect: "P1-wells.wells * P3-hooks.hooks", interpretation: "four hooks a substrate, six substrates"}
  - {id: mountings, kind: count, part: mounting, expect: "P1-wells.wells * P3-hooks.hooks / P3-hooks.per_bar", interpretation: "a mounting carries the two hooks of one bar's side of a substrate"}
  - {id: baseline-hooks, kind: distance, instances: [hook_1, hook_13], between: [hook_1.seat, hook_13.seat], along: y,
     evidence: P11-baseline-hooks, key: L, interpretation: "between facing hooks at zero stretch, as built"}
  # ---- mould
  - {id: mould-base-t, kind: bbox, part: mould_base, evidence: P3-mould-base, axes: {t: z}}
  - {id: mould-posts, kind: count, part: mould_post, evidence: P3-mould-base, key: posts}
  - {id: mould-platform-t, kind: bbox, part: mould_platform, evidence: P7-mould-platform, axes: {t: z}}
  - {id: mould-post-d, kind: diameter, at: mould_post.wall, evidence: P7-mould-posts, key: d}
  - {id: mould-frame-h, kind: bbox, part: mould_frame, evidence: P4-mould-frame, axes: {H: z}}
  - {id: substrate-bottom, kind: distance, instances: [mould_platform_1, mould_frame_1], between: [mould_platform_1.top, mould_frame_1.top], along: z,
     evidence: P4-mould-frame, key: bottom, interpretation: "the frame stands this far above the platform: the cast substrate's bottom"}
  - {id: culture-area, kind: distance, between: [mould_platform.side_a, mould_platform.side_b], expect: "sqrt(P1-area.area)",
     interpretation: "4 cm2 read as the platform's 20 x 20 mm square, its r5 corners not taken off"}
  # ---- motion
  - {id: lead-per-turn, kind: distance, instances: [guide_rod_1, bearing_1], between: [guide_rod_1.zero, bearing_1.mid], along: y,
     evidence: P11-lead, key: lead, from: {}, pose: {screw_1: 360}, interpretation: "carriage travel over one turn of the screws"}
  - {id: stroke-tested, kind: distance, instances: [guide_rod_1, bearing_1], between: [guide_rod_1.zero, bearing_1.mid], along: y,
     evidence: P12-stroke, key: amplitude, from: {}, pose: {screw_1: stroke_turn},
     interpretation: "the largest amplitude the paper ran, 25 mm at 0.5 Hz: the carriage reaches it from zero stretch, inside its travel"}
  - {id: screw-2-turn, kind: angle, instances: [end_plate_1, lead_screw_2], between: [end_plate_1.over_screw_2, lead_screw_2.a, lead_screw_2.mark], along: y,
     expect: "90 + 360 * P12-stroke.amplitude / P11-lead.lead - 1080", pose: {screw_1: stroke_turn},
     interpretation: "over the 25 mm stroke the second screw has turned 25/8 turns with the first, 45 deg past three whole turns, from a mark a quarter turn off the reference"}
  - {id: clear, kind: interference}
  - {id: clear-travel, kind: interference, sweep: {joint: screw_1, steps: sweep_steps}}
