# Written by gen_cutfile.py from checks.src.yaml; edit checks.src.yaml, then rerun gen_cutfile.py.
# Geometry checks. Expected values come from evidence.yaml, never from params.yaml.
checks:
  # ---------------------------------------------------------------- clamp (tracer part)
  - {id: shape-clamp, kind: shape, part: stretch_clamp, body: clamp, tol: 0.03,
     pairs: [[stretch_clamp.corner_l, clamp.corner_l], [stretch_clamp.corner_r, clamp.corner_r], [stretch_clamp.wall_top, clamp.wall_l], [stretch_clamp.hole_a_w, clamp.hole_a_w]],
     interpretation: "tol 0.03 covers the STL's facet sag on the r4 lobes and r1.5 holes"}
  - {id: env-clamp, kind: bbox, part: stretch_clamp, evidence: P-cl-env, axes: {L: x, W: y, H: z}}
  - {id: clamp-hole, kind: distance, part: stretch_clamp, between: [stretch_clamp.hole_a_w, stretch_clamp.hole_a_e], evidence: P-cl-hole, key: d}
  - {id: clamp-pitch, kind: distance, part: stretch_clamp, between: [stretch_clamp.hole_a_w, stretch_clamp.hole_b_w], evidence: P-cl-pitch, key: p}
  - {id: clamp-plate, kind: distance, part: stretch_clamp, between: [stretch_clamp.corner_l, stretch_clamp.top_l], evidence: P-cl-plate, key: t}
  - {id: clamp-notch-in, kind: distance, part: stretch_clamp, between: [stretch_clamp.inner_l, stretch_clamp.inner_r], evidence: P-cl-nin, key: w}
  - {id: clamp-wall-out, kind: distance, part: stretch_clamp, between: [stretch_clamp.wall_top, stretch_clamp.wall_r], evidence: P-cl-nout, key: w}
  - {id: clamp-notch-flat, kind: distance, part: stretch_clamp, between: [stretch_clamp.flat_l, stretch_clamp.flat_r], evidence: P-cl-flat, key: w}
  # ---------------------------------------------------------------- mould frame (MoldFrame.stl) and mould
  - {id: shape-moldframe, kind: shape, part: mould_frame, body: moldframe, tol: 0.005,
     pairs: [[mould_frame.c1, moldframe.c1], [mould_frame.c2, moldframe.c2], [mould_frame.c3, moldframe.c3]],
     interpretation: "tol 0.005 covers the STL's facet sag on the r5 lobes and r2 holes (0.5 degree facets)"}
  - {id: env-moldframe, kind: bbox, part: mould_frame, evidence: P-mf-env, axes: {L: x, W: y}}
  - {id: moldframe-height, kind: bbox, part: mould_frame, evidence: E-frame-h, axes: {h: z}}
  - {id: moldframe-hole, kind: distance, part: mould_frame, between: [mould_frame.hole_w, mould_frame.hole_e], evidence: P-mf-hole, key: d}
  - {id: moldframe-hole-pitch, kind: distance, part: mould_frame, between: [mould_frame.hole_w, mould_frame.hole2_e], evidence: P-mf-holep, key: p}
  - {id: moldframe-window, kind: distance, part: mould_frame, between: [mould_frame.win_w, mould_frame.win_e], evidence: P-mf-win, key: w}
  - {id: moldframe-lobe-pitch, kind: distance, part: mould_frame, between: [mould_frame.lobe_n1, mould_frame.lobe_n2], evidence: P-mf-lobep, key: p}
  - {id: moldframe-lobe-span, kind: distance, part: mould_frame, between: [mould_frame.lobe_n1, mould_frame.lobe_s1], evidence: P-mf-lobespan, key: s}
  - {id: substrate-bottom, kind: distance, instances: [mould_frame_1, platform_1], between: [mould_frame_1.top, platform_1.top_c], along: z, evidence: E-frame-h, key: bottom,
     interpretation: "the substrate's floor: frame top above the raised platform's top, base to frame assembled for casting"}
  - {id: mould-base-thickness, kind: bbox, part: mould_base, evidence: E-base, axes: {t: z}}
  - {id: mould-posts, kind: count, part: straw_post, evidence: E-base, key: n_posts}
  - {id: straw-diameter, kind: diameter, part: straw_post, at: straw_post.wall, evidence: E-straw, key: d}
  - {id: platform-side, kind: distance, part: platform, between: [platform.edge_w, platform.edge_e], expect: "sqrt(E-area.a)",
     interpretation: "the 4 cm2 culture area as a 20 mm square platform"}
  # ---------------------------------------------------------------- stretcher, static
  - {id: plate-thickness, kind: bbox, part: stat_bar, evidence: E-t6, axes: {t: z}}
  - {id: env-profile-short, kind: bbox, part: profile_short, evidence: E-prof-short, axes: {L: x, w: y, h: z}}
  - {id: env-profile-long, kind: bbox, part: profile_long, evidence: E-prof-long, axes: {w: x, L: y, h: z}}
  - {id: profiles-short, kind: count, part: profile_short, evidence: E-prof-short, key: n}
  - {id: profiles-long, kind: count, part: profile_long, evidence: E-prof-long, key: n}
  - {id: motors, kind: count, part: stepper_motor, evidence: E-motors, key: n}
  - {id: lead-screws, kind: count, part: lead_screw, evidence: E-actuators, key: n}
  - {id: wells-wide-frames, kind: count, part: frame_wide, evidence: E-six, key: n, interpretation: "one wide stretch-holding frame per substrate"}
  - {id: foot-height, kind: bbox, part: rubber_foot, evidence: E-feet, axes: {h: z}}
  - {id: baseline, kind: distance, instances: [mount_stat_1, mount_mob_1], between: [mount_stat_1.post_a, mount_mob_1.post_b], along: y, evidence: E-baseline, key: L,
     interpretation: "the substrate's post holes, stationary to mobile mounting, at zero stretch"}
  # ---------------------------------------------------------------- motion
