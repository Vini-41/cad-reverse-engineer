  interpretation: D between the knee pins, leg extended as built
- id: width-range-a
  kind: range
  joint: a_slide
  ends:
  - fig2d-width.Dmax
  instances:
  - a_up_l
  - a_up_r
  between:
  - a_up_l.pin_b
  - a_up_r.pin_b
  along: x
  interpretation: 'pedestal pushed into the thigh by its full stroke: the knees spread to Dmax'
