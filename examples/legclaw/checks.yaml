# Geometry checks. Expected values come from evidence.yaml, never from params.yaml.
# Written by gen_checks.py; edit that script, not this file.
checks:
- id: env-phalanx1
  kind: bbox
  part: phalanx1
  evidence: S2-phalanx1
  axes:
    L: x
    H: z
    W: y
  interpretation: L along the toe (part X), H in the flexion plane (part Z), W along the joint axes (part Y)
- id: env-phalanx2
  kind: bbox
  part: phalanx2
  evidence: S2-phalanx2
  axes:
    L: x
    H: z
    W: y
  interpretation: as phalanx 1
- id: env-claw
  kind: bbox
  part: claw
  evidence: S2-claw
  axes:
    L: x
    H: z
    W: y
  interpretation: L along the toe, H in the flexion plane, W along the joint axis; the hook is not shaped, the envelope is
- id: env-compression
  kind: bbox
  part: comp
  evidence: S2-compression
  axes:
    L: x
    H: z
    W: y
  interpretation: L along the link, H in the four-bar plane, W along the pivots
- id: env-bent
  kind: bbox
  part: bent
  evidence: S2-bent
  axes:
    L: x
    H: z
    W: y
  interpretation: L along the link, H in its plane, W along the pivots
- id: env-linkage
  kind: bbox
  part: linkage
  evidence: S2-linkage
  axes:
    L: x
    H: z
    W: y
  interpretation: L along the link, H in the X plane, W along the pins
- id: env-pedestal
  kind: bbox
  part: pedestal
  evidence: S2-pedestal
  axes:
    L: x
    H: y
    W: z
  interpretation: the 63 mm read as the column length along the leg axis
- id: env-thigh
  kind: bbox
  part: thigh
  evidence: S2-thigh
  axes:
    L: z
    H: x
    W: y
  interpretation: L along the leg axis including the flip-axis ears, H lateral, W along the flip axis
- id: env-wheel
  kind: bbox
  part: wheel
  evidence: S2-wheel
  axes:
    L: x
    H: y
    W: z
  interpretation: 'a disc: L and W the diameter, H the thickness along the servo axis'
- id: len-bent-L14
  kind: distance
  between:
  - bent.tip_a
  - bent.tip_b
  evidence: M42-L14
  key: L14
  along: x
  interpretation: L14 read as the overall tip-to-tip length (conflict K3)
- id: env-sole-a
  kind: bbox
  instances:
  - a_mid
  - a_end_L
  - a_end_R
  - a_lnk_LAf
  - a_lnk_LAb
  - a_lnk_LBf
  - a_lnk_LBb
  - a_lnk_RAf
  - a_lnk_RAb
  - a_lnk_RBf
  - a_lnk_RBb
  evidence: fig2a-sole
  axes:
    L: x
    W: y
    H: z
  interpretation: 'the sole: end frames, centre post and X-structure linkages; L across the bending direction, W along the toe rows, H the frame height'
- id: width-min-a
  kind: distance
  instances:
  - a_up_l
  - a_up_r
  between:
  - a_up_l.pin_b
  - a_up_r.pin_b
  evidence: fig2d-width
  key: Dmin
  along: x
  interpretation: D between the knee pins, leg extended as built
- id: env-sole-b
  kind: bbox
  instances:
  - b_mid
  - b_end_L
  - b_end_R
  - b_lnk_LAf
  - b_lnk_LAb
  - b_lnk_LBf
  - b_lnk_LBb
  - b_lnk_RAf
  - b_lnk_RAb
  - b_lnk_RBf
  - b_lnk_RBb
  evidence: fig2a-sole
  axes:
    L: x
    W: y
    H: z
  interpretation: 'the sole: end frames, centre post and X-structure linkages; L across the bending direction, W along the toe rows, H the frame height'
