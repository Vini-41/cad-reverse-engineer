conflicts:
  - id: K1
    evidence: [P3-gear-mass, P10-mass-420]
    summary: "Sec. 2.1 and Sec. 3 (limitations) give the landing gear as about 430 g; the Conclusion (and Table S1) give 420 g."
    resolution: "430 g is used: it equals the stated parts, two 200 g legs plus 30 g of control board and wiring; 420 g is read as a rounded figure."
  - id: K2
    evidence: [figS1-tension, S2-linkage]
    summary: "Fig. S1B draws the X-tensile structure as a 60 x 46 x 20 mm box of two 30 x 20 mm cells, whose diagonal (36 mm) is longer than the 31 mm linkages of Table S2."
    resolution: "Table S2 and the Fig. 2A sole envelope (70 x 56 x 22 mm) are realised; Fig. S1B is read as a not-to-scale schematic, and the cell geometry follows from the linkage pitch and a proposed pin-row spacing (gap G-cell)."
  - id: K3
    evidence: [M42-L14, S2-bent]
    summary: "Sec. 4.2 uses L14 = 37 mm as a kinematic length of the bent linkage in Eq. (8); Table S2 gives the bent linkage's overall length L as 37 mm. A 37 mm pin pitch cannot fit inside a 37 mm long part with rounded ends."
    resolution: "Both are read as the overall length (checked as the bbox and as the tip-to-tip distance); the pin pitch is the length less the width (pins at the centres of the rounded ends, gap G-bent-pitch)."
