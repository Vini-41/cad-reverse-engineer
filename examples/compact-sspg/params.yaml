# The only place numbers enter the model. basis: source | derived | measured | proposed.
# A param a released STL settles cites its body; the part's shape check, comparing the two whole, checks it.
params:
  # ---- train (Table I), ratio and tooth form
  z_sun:      {basis: source, from: T1.z_sun, interpretation: "sun tooth count"}
  z_planet:   {basis: source, from: T1.z_planet, interpretation: "planet tooth count"}
  z_ring:     {basis: source, from: T1.z_ring, interpretation: "ring tooth count (internal)"}
  module:     {basis: source, from: T1.module, interpretation: "module of all three gears, mm"}
  n_planets:  {basis: source, from: T1.n_planets, interpretation: "planets, equally spaced on the carrier"}
  pressure_angle: {basis: proposed, value: 20, rationale: "standard 20 deg involute; the released gears' flank corners sit on it (planet-, sun-, casing-shape)", gap: G-tooth}
  addendum_coef:  {basis: proposed, value: 1, rationale: "standard full-depth addendum, 1 module; the released gears' tip circles sit on it", gap: G-tooth}
  dedendum_coef:  {basis: proposed, value: 1.25, rationale: "standard dedendum, 1.25 module; the released gears' root circles sit on it", gap: G-tooth}
  centre_dist:   {basis: derived, expr: module * (z_sun + z_planet) / 2, interpretation: "sun-to-planet axis distance (zero backlash, no profile shift); the pins' circle on both carriers"}
  carrier_ratio: {basis: derived, expr: z_sun / (z_sun + z_ring), interpretation: "carrier turn per sun turn with the ring fixed, Eq. (1) inverted"}
  planet_ratio:  {basis: derived, expr: -z_ring / z_planet, interpretation: "planet turn relative to the carrier per carrier turn, ring fixed (internal mesh)"}
  sun_phase:    {basis: derived, expr: 90 / z_sun + degrees(tan(radians(pressure_angle)) - radians(pressure_angle)), gap: G-clock, interpretation: "tooth 0's centre angle (deg) from the part's 0 deg axis: half the tooth's angular thickness at the base circle, so the involute starts on the 0 deg axis, as in all three released gears"}
  planet_phase: {basis: derived, expr: 90 / z_planet + degrees(tan(radians(pressure_angle)) - radians(pressure_angle)), gap: G-clock, interpretation: "as sun_phase, for the planet"}
  ring_phase:   {basis: derived, expr: 90 / z_ring + degrees(tan(radians(pressure_angle)) - radians(pressure_angle)), gap: G-clock, interpretation: "as sun_phase, for the ring's tooth spaces, from the casing's bolt-pattern 0 deg"}

  # ---- planet
  planet_w:    {basis: source, from: planet, value: 22.135, interpretation: "face width = overall length along the planet axis"}
  planet_bore: {basis: source, from: planet, value: 10, interpretation: "through bore between the bearing seats"}
  planet_cb_d: {basis: source, from: planet, value: 12, interpretation: "bearing-seat counterbore at each face"}
  planet_cb_h: {basis: source, from: planet, value: 3.5, interpretation: "bearing-seat depth, same at both faces"}

  # ---- sun (frame: shaft end at z = 0, flange at the top)
  sun_cb_d:     {basis: source, from: sun, value: 8.9, interpretation: "bolt-head counterbore in the flange end"}
  sun_bore_dr:  {basis: source, from: sun, value: 1.95, interpretation: "counterbore radius less the through bore's"}
  sun_bore_d:   {basis: derived, expr: sun_cb_d - 2 * sun_bore_dr, interpretation: "through bore for the centre bolt"}
  sun_cb_h:     {basis: source, from: sun, value: 5, interpretation: "counterbore depth"}
  sun_tip_dr:   {basis: source, from: sun, value: 1, interpretation: "shaft end radius less the bore's"}
  sun_tip_d:    {basis: derived, expr: sun_bore_d + 2 * sun_tip_dr, interpretation: "shaft end diameter after its chamfer"}
  sun_cham:     {basis: source, from: sun, value: 0.5, interpretation: "shaft end chamfer height"}
  sun_step_d:   {basis: source, from: sun, value: 9, interpretation: "bearing shoulder step above the shaft"}
  sun_shaft_dr: {basis: source, from: sun, value: 0.5, interpretation: "step radius less the shaft's"}
  sun_shaft_d:  {basis: derived, expr: sun_step_d - 2 * sun_shaft_dr, interpretation: "shaft (bearing seat) diameter"}
  sun_shaft_l:  {basis: source, from: sun, value: 6.5, interpretation: "shaft length from its end to the step"}
  sun_step_h:   {basis: source, from: sun, value: 1, interpretation: "step height"}
  sun_hub_d:    {basis: source, from: sun, value: 10, interpretation: "hub diameter at the gear's lower face, reached by a chamfer from the step"}
  sun_hub_ch:   {basis: source, from: sun, value: 0.5, interpretation: "chamfer height from the step to the hub"}
  sun_face:     {basis: source, from: sun, value: 30.135, interpretation: "toothed length, gear lower face to the flange"}
  sun_fl_dr:    {basis: source, from: sun, value: 12.05, interpretation: "flange radius less the counterbore's"}
  sun_fl_d:     {basis: derived, expr: sun_cb_d + 2 * sun_fl_dr, interpretation: "flange (motor rotor coupling) diameter"}
  sun_fl_t:     {basis: source, from: sun, value: 4, interpretation: "flange thickness"}
  sun_pcd:      {basis: source, from: sun, value: 23, interpretation: "flange hole circle diameter"}
  sun_hole:     {basis: source, from: sun, value: 4, interpretation: "flange hole"}
  sun_csk:      {basis: source, from: sun, value: 8, interpretation: "flange hole countersink at the flange's lower face"}
  sun_csk_h:    {basis: source, from: sun, value: 2, interpretation: "countersink depth"}
  sun_hole_pitch: {basis: source, from: sun, value: 90, interpretation: "angle at a hole between its two neighbours"}
  sun_n_holes:  {basis: derived, expr: 360 / (180 - sun_hole_pitch), interpretation: "holes in the flange: a regular polygon's interior angle is 180 - 360/n"}

  # ---- primary carrier (frame: output face at z = 0)
  car_h:      {basis: source, from: carrier_updated, value: 35.635, interpretation: "output face to the pins' and extrusions' top"}
  car_disc_d: {basis: source, from: carrier_updated, value: 55, interpretation: "output disc, the output bearing's seat"}
  car_cham:   {basis: source, from: carrier_updated, value: 0.5, interpretation: "45 deg chamfer on the disc's output edge"}
  car_disc_h: {basis: source, from: carrier_updated, value: 9, interpretation: "disc height to the flange"}
  car_fl_dr:  {basis: source, from: carrier_updated, value: 1.5, interpretation: "flange radius less the disc's"}
  car_fl_d:   {basis: derived, expr: car_disc_d + 2 * car_fl_dr, interpretation: "flange, the output bearing's shoulder"}
  car_fl_t:   {basis: source, from: carrier_updated, value: 1.5, interpretation: "flange thickness"}
  car_b1:     {basis: source, from: carrier_updated, value: 13, interpretation: "central bore at the output face"}
  car_b1_h:   {basis: source, from: carrier_updated, value: 5.5, interpretation: "its depth"}
  car_b2:     {basis: source, from: carrier_updated, value: 16, interpretation: "sun bearing seat bore above it"}
  car_b2_h:   {basis: source, from: carrier_updated, value: 4.5, interpretation: "seat depth to its entry chamfer"}
  car_b2c:    {basis: source, from: carrier_updated, value: 17, interpretation: "seat entry chamfer diameter at the flange's top face"}
  car_pock_dr: {basis: source, from: carrier_updated, value: 1.95, interpretation: "pin pocket radius less the pin bore's"}
  car_pock_h: {basis: source, from: carrier_updated, value: 5, interpretation: "pin pocket depth from the output face"}
  car_pinb:   {basis: source, from: carrier_updated, value: 5.4, interpretation: "planet-pin bore"}
  car_pin:    {basis: source, from: carrier_updated, value: 8, interpretation: "planet pin outside diameter"}
  car_col:    {basis: source, from: carrier_updated, value: 10, interpretation: "pin collar diameter"}
  car_col_h:  {basis: source, from: carrier_updated, value: 1.5, interpretation: "collar height on the flange's top face"}
  car_col_f:  {basis: source, from: carrier_updated, value: 0.5, interpretation: "round on the collar's top edge (radius = its height between tangent points)"}
  car_bolt:   {basis: source, from: carrier_updated, value: 3.4, interpretation: "bolt hole through each extrusion"}
  car_bcb_dr: {basis: source, from: carrier_updated, value: 1.45, interpretation: "bolt counterbore radius less the hole's"}
  car_bcb_h:  {basis: source, from: carrier_updated, value: 3, interpretation: "bolt counterbore depth from the output face"}
  car_bolt_dy: {basis: source, from: carrier_updated, value: 35.25, interpretation: "y difference of the bolts at -90 and 30 deg"}
  car_bolt_r: {basis: derived, expr: car_bolt_dy * 2 / 3, interpretation: "bolt circle radius: holes at -90 and 30 deg differ in y by R (1 + sin 30) = 1.5 R"}
  car_nut:    {basis: source, from: carrier_updated, value: 4.4, interpretation: "disc bolt hole"}
  car_nut_d:  {basis: source, from: carrier_updated, value: 36, interpretation: "disc bolt circle diameter"}
  car_hex:    {basis: source, from: carrier_updated, value: 8.083, interpretation: "nut trap across corners, a corner at 90 deg"}
  car_hex_h:  {basis: source, from: carrier_updated, value: 6, interpretation: "nut trap depth from the flange's top face"}
  car_nut_pitch: {basis: source, from: carrier_updated, value: 120, interpretation: "angle at a disc bolt hole between its neighbours"}
  car_hex_ang: {basis: source, from: carrier_updated, value: 120, interpretation: "angle at a nut trap's corner between its neighbours"}
  hex_sides:  {basis: derived, expr: 360 / (180 - car_hex_ang), interpretation: "sides of every nut trap (carrier, secondary carrier, casing slots): hexagons, a regular polygon's interior angle being 180 - 360/n"}
  car_n_nuts: {basis: derived, expr: 360 / (180 - car_nut_pitch), interpretation: "disc bolt holes: a regular polygon's interior angle is 180 - 360/n"}
  dce:        {basis: source, from: DCE.dce, interpretation: "clearance between a planet's tip circle and the carrier extrusions"}
  ext_clear_r: {basis: derived, expr: module * z_planet / 2 + addendum_coef * module + dce, interpretation: "each extrusion's flank: an arc about the planet axis at the planet's tip radius plus the stated clearance"}
  car_tip_dy: {basis: source, from: carrier_updated, value: 2.75, interpretation: "extrusion tip's inner circle radius less the seat chamfer's"}
  ext_in_r:   {basis: derived, expr: car_b2c / 2 + car_tip_dy, interpretation: "extrusions' inner bound, a circle about the carrier axis"}
  ext_fillet: {basis: proposed, value: 1.5, rationale: "round on the extrusions' four vertical edges; the released corners fit a 1.5 mm arc", gap: G-rounds}

  # ---- secondary carrier (frame: pin bosses' face at z = 0)
  sec_od:      {basis: source, from: sec_carrier, value: 56.5, interpretation: "outside diameter"}
  sec_id:      {basis: source, from: sec_carrier, value: 32, interpretation: "inside diameter"}
  sec_t:       {basis: source, from: sec_carrier, value: 5, interpretation: "plate thickness"}
  sec_boss_h:  {basis: source, from: sec_carrier, value: 1.5, interpretation: "pin boss height below the plate"}
  sec_boss_id: {basis: source, from: sec_carrier, value: 8, interpretation: "pin boss bore (fits over the pin end)"}
  sec_boss_ch: {basis: source, from: sec_carrier, value: 0.25, interpretation: "45 deg chamfer on the boss bore's face edge"}
  sec_boss_bot_r: {basis: proposed, value: 4.56, rationale: "pin boss's outer radius at its face, where its flank (modelled as a cone to the root) starts; read off the released corners", gap: G-boss}
  sec_boss_dr: {basis: source, from: sec_carrier, value: 4, interpretation: "boss root radius at the plate less the pin hole's"}
  sec_pin:     {basis: source, from: sec_carrier, value: 5, interpretation: "pin hole"}
  sec_phex:    {basis: source, from: sec_carrier, value: 10.161, interpretation: "pin nut trap across corners, a corner at 0 deg"}
  sec_hex_h:   {basis: source, from: sec_carrier, value: 2.5, interpretation: "nut trap depth (both traps)"}
  sec_bolt:    {basis: source, from: sec_carrier, value: 3, interpretation: "bolt hole"}
  sec_bhex:    {basis: source, from: sec_carrier, value: 7.275, interpretation: "bolt nut trap across corners, a corner at 90 deg"}
  sec_bolt_dy: {basis: source, from: sec_carrier, value: 36.375, interpretation: "y difference of the bolts at -90 and 30 deg"}
  sec_bolt_r:  {basis: derived, expr: sec_bolt_dy * 2 / 3, interpretation: "bolt circle radius, 1.5 R as on the primary carrier"}

  # ---- gearbox casing (frame: output face at z = 0, ring axis on z)
  cas_h:      {basis: source, from: gearbox_casing, value: 40.635, interpretation: "output face to the motor-end face"}
  cas_b0:     {basis: source, from: gearbox_casing, value: 74, interpretation: "bearing bore entry diameter at the output face"}
  cas_od_dr:  {basis: source, from: gearbox_casing, value: 7, interpretation: "output-end outside radius less the bore entry's"}
  cas_b1_dr:  {basis: source, from: gearbox_casing, value: 1, interpretation: "bore entry radius less the bearing bore's (45 deg chamfer)"}
  cas_bch:    {basis: source, from: gearbox_casing, value: 1, interpretation: "bore entry chamfer height"}
  cas_b1_h:   {basis: source, from: gearbox_casing, value: 9, interpretation: "bearing bore depth from the output face"}
  cas_lip_dr: {basis: source, from: gearbox_casing, value: 1.5, interpretation: "bearing bore radius less the shoulder lip's"}
  cas_lip_h:  {basis: source, from: gearbox_casing, value: 1.5, interpretation: "lip height, up to the ring's lower face"}
  cas_ring_w: {basis: source, from: gearbox_casing, value: 23.635, interpretation: "ring face width"}
  drw:        {basis: source, from: DRW.drw, interpretation: "ring's radial width from its pitch circle to its outside"}
  cas_neck0:  {basis: source, from: gearbox_casing, value: 1.199, interpretation: "taper from the output-end diameter to the ring's outside, starting at the ring's lower face"}
  cas_neck1:  {basis: source, from: gearbox_casing, value: 2.557, interpretation: "straight length of the ring's outside before the flare"}
  cas_fl:     {basis: source, from: gearbox_casing, value: 9.642, interpretation: "flare's end on the body cylinder, below the motor-end face"}
  cas_body:   {basis: source, from: gearbox_casing, value: 102.8, interpretation: "body diameter at the motor end"}
  cas_pk:     {basis: source, from: gearbox_casing, value: 96.8, interpretation: "motor-end spigot pocket"}
  cas_pk_h:   {basis: source, from: gearbox_casing, value: 2, interpretation: "pocket depth"}
  cas_lobe:   {basis: source, from: gearbox_casing, value: 99.8, interpretation: "pocket lobes' peaks, across"}
  cas_lobe_pitch: {basis: source, from: gearbox_casing, value: 160, interpretation: "angle at a lobe peak between its neighbours"}
  cas_n_lobes: {basis: derived, expr: 360 / (180 - cas_lobe_pitch), interpretation: "lobes: a regular polygon's interior angle is 180 - 360/n"}
  lobe_fillet: {basis: proposed, value: 2.5, rationale: "round where each lobe meets the pocket; the released corners fit a 2.5 mm arc", gap: G-rounds}
  cas_sh45:   {basis: source, from: gearbox_casing, value: 90, interpretation: "shelf's inner edge at the pocket floor"}
  cas_sh43:   {basis: source, from: gearbox_casing, value: 86.5, interpretation: "bore above the ring"}
  cas_shc:    {basis: source, from: gearbox_casing, value: 2.5, interpretation: "chamfer from that bore to the shelf, height"}
  cas_shb:    {basis: source, from: gearbox_casing, value: 1, interpretation: "that bore's straight length"}
  cas_shf:    {basis: source, from: gearbox_casing, value: 1, interpretation: "round between the ring's upper face and that bore (radius = its height between tangent points)"}
  cas_lugt:   {basis: source, from: gearbox_casing, value: 112.3, interpretation: "mounting lugs' tips, across"}
  cas_lug_d:  {basis: source, from: gearbox_casing, value: 104.8, interpretation: "lug hole circle diameter"}
  cas_lugh:   {basis: source, from: gearbox_casing, value: 3, interpretation: "lug hole"}
  cas_lug_pitch: {basis: source, from: gearbox_casing, value: 120, interpretation: "angle at a lug between its neighbours"}
  cas_n_lugs: {basis: derived, expr: 360 / (180 - cas_lug_pitch), interpretation: "lugs: a regular polygon's interior angle is 180 - 360/n"}
  lug_fillet: {basis: proposed, value: 3, rationale: "round where each lug meets the body; the released corners fit a 3 mm arc", gap: G-rounds}
  cas_lcb:    {basis: source, from: gearbox_casing, value: 5.9, interpretation: "lug counterbore, cut from below"}
  cas_lcbz:   {basis: source, from: gearbox_casing, value: 4.5, interpretation: "counterbore's top below the motor-end face"}
  cas_hole:   {basis: source, from: gearbox_casing, value: 4, interpretation: "output-end bolt hole"}
  cas_hole_h: {basis: source, from: gearbox_casing, value: 9, interpretation: "its depth"}
  cas_hole_d: {basis: source, from: gearbox_casing, value: 80, interpretation: "output-end bolt circle diameter"}
  cas_hole_pitch: {basis: source, from: gearbox_casing, value: 120, interpretation: "angle at a hole between its neighbours"}
  cas_n_holes: {basis: derived, expr: 360 / (180 - cas_hole_pitch), interpretation: "holes: a regular polygon's interior angle is 180 - 360/n"}
  cas_nut:    {basis: source, from: gearbox_casing, value: 8.083, interpretation: "nut slot across corners, corners tangential; also the slot's width"}
  cas_nut_z:  {basis: source, from: gearbox_casing, value: 3, interpretation: "slot's lower face above the output face"}
  cas_nut_t:  {basis: source, from: gearbox_casing, value: 3.2, interpretation: "slot thickness"}

  # ---- bearing retainer (frame: casing side at z = 0)
  ret_od:   {basis: source, from: bearing_retainer, value: 88, interpretation: "outside diameter"}
  ret_id:   {basis: source, from: bearing_retainer, value: 70.5, interpretation: "inside diameter"}
  ret_t:    {basis: source, from: bearing_retainer, value: 2, interpretation: "thickness"}
  ret_hole: {basis: source, from: bearing_retainer, value: 4, interpretation: "bolt hole"}
  ret_hole_d: {basis: source, from: bearing_retainer, value: 80, interpretation: "bolt circle diameter"}
  ret_pitch: {basis: source, from: bearing_retainer, value: 120, interpretation: "angle at a hole between its neighbours"}
  ret_n_holes: {basis: derived, expr: 360 / (180 - ret_pitch), interpretation: "holes: a regular polygon's interior angle is 180 - 360/n"}

  # ---- assembly placement (frames' z offsets in the casing frame)
  sun_z:    {basis: derived, expr: car_disc_h + car_fl_t - sun_shaft_l, gap: G-place, interpretation: "the sun's step sits on its bearing, whose top is flush with the carrier's flange top"}
  planet_z: {basis: derived, expr: car_disc_h + car_fl_t + car_col_h, gap: G-place, interpretation: "each planet's face rests on its pin collar"}
  sec_z:    {basis: derived, expr: car_h - sec_boss_h, gap: G-place, interpretation: "the secondary carrier's plate rests on the pins' tops, the bosses around the pin ends"}

  # ---- where each released file holds its part: its frame, which the part is built in
  planet_file_x:    {basis: source, from: planet, value: 16.75, interpretation: "planet axis in its file, x"}
  planet_file_y:    {basis: source, from: planet, value: 16.74608, interpretation: "planet axis in its file, y"}
  planet_file_turn: {basis: source, from: planet, value: 182.769231, interpretation: "planet turned about its axis in its file from the model's tooth 0, deg: half a tooth past a half turn"}
  sun_file_x:       {basis: source, from: sun, value: 16.5, interpretation: "sun axis in its file, x"}
  sun_file_y:       {basis: source, from: sun, value: 16.5, interpretation: "sun axis in its file, y"}
  car_file_x:       {basis: source, from: carrier_updated, value: 29, interpretation: "primary carrier axis in its file, x"}
  car_file_y:       {basis: source, from: carrier_updated, value: 29, interpretation: "primary carrier axis in its file, y"}
  car_file_z:       {basis: source, from: carrier_updated, value: 0.21, interpretation: "primary carrier's output face above its file's origin"}
  sec_file_x:       {basis: source, from: sec_carrier, value: 28.25, interpretation: "secondary carrier axis in its file, x"}
  sec_file_y:       {basis: source, from: sec_carrier, value: 28.25, interpretation: "secondary carrier axis in its file, y"}
  sec_file_z:       {basis: source, from: sec_carrier, value: 0.278, interpretation: "secondary carrier's boss faces above its file's origin"}
  cas_file_x:       {basis: source, from: gearbox_casing, value: 51.4, interpretation: "casing axis in its file, x"}
  cas_file_y:       {basis: source, from: gearbox_casing, value: 56.15, interpretation: "casing axis in its file, y"}
  ret_file_x:       {basis: source, from: bearing_retainer, value: 44, interpretation: "retainer axis in its file, x; the file stands it on y, its casing side at y 0"}
  ret_file_z:       {basis: source, from: bearing_retainer, value: 44, interpretation: "retainer axis in its file, z"}

  # ---- mass model
  print_density: {basis: proposed, value: 0.00124, rationale: "PLA at 1.24 g/cm3 (the paper prints in PLA at 100% infill); weighs the printed parts for the MJCF", gap: G-density}

parts:
  planet_gear: {density: print_density}
  sun_gear: {density: print_density}
  primary_carrier: {density: print_density}
  secondary_carrier: {density: print_density}
  casing: {density: print_density}
  retainer: {density: print_density}
