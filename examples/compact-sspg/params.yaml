# The only place numbers enter the model. basis: source | derived | measured | proposed.
# A value read off a released body is its design value as read_bodies.py prints it, with the
# heights to the 0.0001 mm the STL holds them to.
params:
  # ---- the train: Table I ----------------------------------------------------------------
  z_sun: {basis: source, from: T1-sspg.z_sun}
  z_planet: {basis: source, from: T1-sspg.z_planet}
  z_ring: {basis: source, from: T1-sspg.z_ring}
  module: {basis: source, from: T1-sspg.module}
  n_planets: {basis: source, from: T1-sspg.n_planets}
  pressure_angle: {basis: source, from: planet, value: 20, interpretation: "the involute's pressure angle, in degrees, the same on the sun, the planets and the ring; no profile shift and no backlash allowance on any of them"}
  carrier_ratio: {basis: derived, expr: z_sun / (z_sun + z_ring), interpretation: "the carrier's turn per turn of the sun, the ring fixed"}
  planet_ratio: {basis: derived, expr: -z_ring / z_planet, interpretation: "a planet's turn on its post per turn of the carrier, the ring fixed"}
  flank_points: {basis: proposed, value: 5, rationale: "the points of the involute each flank's spline is drawn through, evenly spaced in roll angle: at five the spline lies within 0.0001 mm of the true involute on all three gears, and the released bodies' flank corners lie on it", gap: G-flank}

  # ---- planet: read off its released body ------------------------------------------------
  planet_axis_x: {basis: source, from: planet, value: 16.75, interpretation: "frame: the gear's axis runs along file z through x = 16.75"}
  planet_axis_y: {basis: source, from: planet, value: 16.7461, interpretation: "frame: the gear's axis runs along file z through y = 16.7461, the reach of the tooth tip nearest -y"}
  planet_width: {basis: source, from: planet, value: 22.1348, interpretation: "face width, file z from 0"}
  planet_tip_d: {basis: source, from: planet, value: 33.5, interpretation: "tip circle diameter"}
  planet_root_d: {basis: source, from: planet, value: 31.25, interpretation: "root circle diameter"}
  planet_bore_d: {basis: source, from: planet, value: 10, interpretation: "bore between the two bearing seats"}
  planet_seat_d: {basis: source, from: planet, value: 12, interpretation: "bearing seat diameter, one at each end"}
  planet_seat_depth: {basis: source, from: planet, value: 3.5, interpretation: "bearing seat depth from each end face"}

  # ---- sun: read off its released body ---------------------------------------------------
  sun_axis_x: {basis: source, from: sun, value: 16.5, interpretation: "frame: the gear's axis runs along file z through x = 16.5"}
  sun_axis_y: {basis: source, from: sun, value: 16.5, interpretation: "frame: the gear's axis runs along file z through y = 16.5"}
  sun_bore_d: {basis: source, from: sun, value: 5, interpretation: "bore for the central bolt"}
  sun_journal_d: {basis: source, from: sun, value: 8, interpretation: "journal at the shaft's free end, file z from 0"}
  sun_journal_len: {basis: source, from: sun, value: 6.5, interpretation: "journal length, its end chamfer included"}
  sun_journal_chamfer: {basis: source, from: sun, value: 0.5, interpretation: "chamfer on the journal's end"}
  sun_shoulder_d: {basis: source, from: sun, value: 9, interpretation: "shoulder between the journal and the teeth"}
  sun_shoulder_len: {basis: source, from: sun, value: 1.5, interpretation: "shoulder length, its chamfer up to the teeth included"}
  sun_shoulder_chamfer: {basis: source, from: sun, value: 0.5, interpretation: "chamfer from the shoulder out to the core under the teeth"}
  sun_teeth_len: {basis: source, from: sun, value: 30.1348, interpretation: "face width, from the shoulder to the flange"}
  sun_tip_d: {basis: source, from: sun, value: 13.5, interpretation: "tip circle diameter"}
  sun_root_d: {basis: source, from: sun, value: 11.25, interpretation: "root circle diameter"}
  sun_flange_d: {basis: source, from: sun, value: 33, interpretation: "motor flange diameter"}
  sun_flange_t: {basis: source, from: sun, value: 4, interpretation: "motor flange thickness"}
  sun_pocket_d: {basis: source, from: sun, value: 8.9, interpretation: "bolt head pocket in the flange face"}
  sun_pocket_depth: {basis: source, from: sun, value: 5, interpretation: "bolt head pocket depth from the flange face"}
  sun_mount_circle_r: {basis: source, from: sun, value: 11.5, interpretation: "radius of the flange's mounting hole circle; the first hole lies on the file's +x from the axis"}
  sun_mount_d: {basis: source, from: sun, value: 4, interpretation: "mounting hole diameter"}
  sun_n_mounts: {basis: source, from: sun, value: 4, interpretation: "mounting holes, evenly spaced"}
  sun_csk_d: {basis: source, from: sun, value: 8, interpretation: "countersink diameter on the flange's gear-side face"}
  sun_csk_depth: {basis: source, from: sun, value: 2, interpretation: "countersink depth"}

  # ---- carrier (updated release): read off its released body -----------------------------
  car_axis_x: {basis: source, from: carrier_updated, value: 29, interpretation: "frame: the carrier's axis runs along file z through x = 29"}
  car_axis_y: {basis: source, from: carrier_updated, value: 29, interpretation: "frame: the carrier's axis runs along file z through y = 29"}
  car_z0: {basis: source, from: carrier_updated, value: 0.2099, interpretation: "frame: the output face lies at file z = 0.2099"}
  car_len: {basis: source, from: carrier_updated, value: 35.6348, interpretation: "overall length, output face to the ends of the posts and extrusions"}
  car_journal_d: {basis: source, from: carrier_updated, value: 55, interpretation: "journal the output bearing sits on"}
  car_journal_len: {basis: source, from: carrier_updated, value: 9, interpretation: "journal length from the output face, its chamfer included"}
  car_journal_chamfer: {basis: source, from: carrier_updated, value: 0.5, interpretation: "chamfer on the journal's output end"}
  car_flange_d: {basis: source, from: carrier_updated, value: 58, interpretation: "flange behind the journal, the bearing's shoulder"}
  car_flange_t: {basis: source, from: carrier_updated, value: 1.5, interpretation: "flange thickness; its far face is the plate's inner face"}
  car_bore_d: {basis: source, from: carrier_updated, value: 13, interpretation: "central bore from the output face to the sun bearing's seat"}
  car_seat_d: {basis: source, from: carrier_updated, value: 16, interpretation: "sun bearing seat, opening on the inner face"}
  car_seat_depth: {basis: source, from: carrier_updated, value: 5, interpretation: "seat depth from the inner face, its chamfer included"}
  car_seat_chamfer: {basis: source, from: carrier_updated, value: 0.5, interpretation: "chamfer at the seat's mouth"}
  car_out_circle_r: {basis: source, from: carrier_updated, value: 18, interpretation: "radius of the output mounting holes' circle; the first hole lies on the file's +x from the axis"}
  car_out_hole_d: {basis: source, from: carrier_updated, value: 4.4, interpretation: "output mounting hole diameter"}
  car_n_out: {basis: source, from: carrier_updated, value: 6, interpretation: "output mounting holes, evenly spaced"}
  car_out_hole_len: {basis: source, from: carrier_updated, value: 4.5, interpretation: "output mounting hole length from the output face to its nut pocket"}
  car_out_nut_af: {basis: source, from: carrier_updated, value: 7, interpretation: "nut pocket across flats, a flat square to the radius; the pocket opens on the inner face"}
  hex_sides: {basis: source, from: carrier_updated, value: 6, interpretation: "sides of a nut pocket: every one is a hexagon, on the carrier, the secondary carrier and the casing"}
  car_post_circle_r: {basis: source, from: carrier_updated, value: 22.5, interpretation: "radius of the planet posts' circle; the first post lies on the file's +y from the axis"}
  car_post_d: {basis: source, from: carrier_updated, value: 8, interpretation: "planet post diameter"}
  car_boss_d: {basis: source, from: carrier_updated, value: 10, interpretation: "boss at the foot of each post"}
  car_boss_h: {basis: source, from: carrier_updated, value: 1.5, interpretation: "boss height above the inner face"}
  car_boss_round: {basis: source, from: carrier_updated, value: 0.5, interpretation: "round on the boss's outer edge"}
  car_head_d: {basis: source, from: carrier_updated, value: 9.3, interpretation: "planet shaft bolt head pocket in the output face"}
  car_head_depth: {basis: source, from: carrier_updated, value: 5, interpretation: "head pocket depth"}
  car_shaft_hole_d: {basis: source, from: carrier_updated, value: 5.4, interpretation: "planet shaft bolt hole through each post"}
  car_ext_circle_r: {basis: source, from: carrier_updated, value: 23.5, interpretation: "radius of the extrusion bolt holes' circle, midway between the posts"}
  car_ext_hole_d: {basis: source, from: carrier_updated, value: 3.4, interpretation: "extrusion bolt hole diameter"}
  car_ext_head_d: {basis: source, from: carrier_updated, value: 6.3, interpretation: "extrusion bolt head pocket in the output face"}
  car_ext_head_depth: {basis: source, from: carrier_updated, value: 3, interpretation: "extrusion bolt head pocket depth"}
  car_lobe_inner_d: {basis: source, from: carrier_updated, value: 22.5, interpretation: "the extrusions' inner faces lie on this circle about the axis"}
  car_lobe_outer_d: {basis: source, from: carrier_updated, value: 55, interpretation: "the extrusions' outer faces lie on this circle about the axis"}
  car_lobe_clear_r: {basis: source, from: carrier_updated, value: 17.75, interpretation: "the extrusions' flanks are arcs of this radius about the posts, 1 mm off the planets' tip circle"}
  car_lobe_fillet: {basis: source, from: carrier_updated, value: 1.5, interpretation: "fillet on the four corners of each extrusion's section"}

  # ---- secondary carrier: read off its released body -------------------------------------
  sec_axis_x: {basis: source, from: sec_carrier, value: 28.25, interpretation: "frame: the plate's axis runs along file z through x = 28.25"}
  sec_axis_y: {basis: source, from: sec_carrier, value: 28.25, interpretation: "frame: the plate's axis runs along file z through y = 28.25"}
  sec_z0: {basis: source, from: sec_carrier, value: 0.2783, interpretation: "frame: the bosses' end faces lie at file z = 0.2783"}
  sec_od: {basis: source, from: sec_carrier, value: 56.5, interpretation: "plate outer diameter"}
  sec_id: {basis: source, from: sec_carrier, value: 32, interpretation: "plate bore, which the sun passes through"}
  sec_t: {basis: source, from: sec_carrier, value: 5, interpretation: "plate thickness"}
  sec_post_circle_r: {basis: source, from: sec_carrier, value: 22.5, interpretation: "radius of the circle the bosses and their post sockets stand on; the first lies on the file's +y from the axis"}
  sec_boss_d: {basis: source, from: sec_carrier, value: 10, interpretation: "boss diameter at its end face"}
  sec_boss_h: {basis: source, from: sec_carrier, value: 1.5, interpretation: "boss height off the plate"}
  sec_boss_fillet: {basis: source, from: sec_carrier, value: 1.5, interpretation: "fillet from each boss into the plate's face; where the plate's rim cuts the face short the fillet's ball rolls on the rim's edge"}
  sec_boss_round: {basis: source, from: sec_carrier, value: 0.5, interpretation: "round on the end face's outer edge, on the first boss alone: the released body rounds one boss of the three"}
  sec_socket_d: {basis: source, from: sec_carrier, value: 8, interpretation: "socket in each boss for a carrier post"}
  sec_socket_depth: {basis: source, from: sec_carrier, value: 1.5, interpretation: "socket depth from the boss's end face, its chamfer included"}
  sec_socket_chamfer: {basis: source, from: sec_carrier, value: 0.25, interpretation: "chamfer at the socket's mouth"}
  sec_shaft_hole_d: {basis: source, from: sec_carrier, value: 5, interpretation: "planet shaft bolt hole from each socket to its nut pocket"}
  sec_shaft_nut_af: {basis: source, from: sec_carrier, value: 8.8, interpretation: "planet shaft nut pocket across flats, a flat square to the radius"}
  sec_nut_depth: {basis: source, from: sec_carrier, value: 2.5, interpretation: "depth of every nut pocket from the plate's far face"}
  sec_ext_circle_r: {basis: source, from: sec_carrier, value: 24.25, interpretation: "radius of the extrusion bolt holes' circle, midway between the bosses"}
  sec_ext_hole_d: {basis: source, from: sec_carrier, value: 3, interpretation: "extrusion bolt hole diameter"}
  sec_ext_nut_af: {basis: source, from: sec_carrier, value: 6.3, interpretation: "extrusion nut pocket across flats, a corner on the radius"}

  # ---- gearbox casing, with the ring gear inside it: read off its released body ----------
  cas_axis_x: {basis: source, from: gearbox_casing, value: 51.4, interpretation: "frame: the casing's axis runs along file z through x = 51.4, the flange's radius"}
  cas_axis_y: {basis: source, from: gearbox_casing, value: 56.15, interpretation: "frame: the casing's axis runs along file z through y = 56.15, the reach of the flange's ears"}
  cas_len: {basis: source, from: gearbox_casing, value: 40.6348, interpretation: "overall length, file z from 0 at the output end to the motor-side flange face"}
  cas_body_d: {basis: source, from: gearbox_casing, value: 88, interpretation: "outer diameter at the output end"}
  cas_body_len: {basis: source, from: gearbox_casing, value: 10.5, interpretation: "length of the output end's outer cylinder"}
  cas_neck_len: {basis: source, from: gearbox_casing, value: 1.199, interpretation: "length of the cone from the outer cylinder down to the waist"}
  cas_waist_d: {basis: source, from: gearbox_casing, value: 87.5, interpretation: "waist diameter, the narrowest of the outside"}
  cas_flare_z: {basis: source, from: gearbox_casing, value: 14.2556, interpretation: "file z where the waist ends and the flare to the flange begins, tangent to the waist"}
  cas_flare_r: {basis: source, from: gearbox_casing, value: 22.1348, interpretation: "radius of the flare's arc in section, its centre outside the casing level with the flare's start"}
  cas_flange_d: {basis: source, from: gearbox_casing, value: 102.8, interpretation: "flange diameter between its ears"}
  cas_ear_circle_r: {basis: source, from: gearbox_casing, value: 52.4, interpretation: "radius of the circle the flange's ears and their holes stand on, the first midway to the next from the file's +x"}
  cas_ear_r: {basis: source, from: gearbox_casing, value: 3.75, interpretation: "radius of each ear about its hole"}
  cas_ear_fillet: {basis: source, from: gearbox_casing, value: 3, interpretation: "fillet joining each ear to the flange's circle"}
  cas_n_ears: {basis: source, from: gearbox_casing, value: 6, interpretation: "ears, evenly spaced"}
  cas_ear_hole_d: {basis: source, from: gearbox_casing, value: 3, interpretation: "hole through each ear"}
  cas_ear_hole_len: {basis: source, from: gearbox_casing, value: 4.5, interpretation: "ear hole length from the flange face down to its counterbore"}
  cas_ear_cbore_d: {basis: source, from: gearbox_casing, value: 5.9, interpretation: "counterbore under each ear hole, cut up through the flare"}
  cas_seat_d: {basis: source, from: gearbox_casing, value: 72, interpretation: "output bearing seat diameter"}
  cas_seat_depth: {basis: source, from: gearbox_casing, value: 9, interpretation: "seat depth from the output end, its chamfer included"}
  cas_seat_chamfer: {basis: source, from: gearbox_casing, value: 1, interpretation: "chamfer at the seat's mouth"}
  cas_shoulder_d: {basis: source, from: gearbox_casing, value: 69, interpretation: "bore of the shoulder between the bearing seat and the ring gear"}
  cas_ring_z: {basis: source, from: gearbox_casing, value: 10.5, interpretation: "file z where the ring gear's teeth begin"}
  cas_ring_width: {basis: source, from: gearbox_casing, value: 23.6348, interpretation: "ring gear face width"}
  cas_ring_tip_d: {basis: source, from: gearbox_casing, value: 76.5, interpretation: "ring gear tip circle diameter"}
  cas_ring_root_d: {basis: source, from: gearbox_casing, value: 78.75, interpretation: "ring gear root circle diameter"}
  cas_well_floor_d: {basis: source, from: gearbox_casing, value: 84.5, interpretation: "diameter the flat floor above the ring gear reaches before its fillet"}
  cas_well_fillet: {basis: source, from: gearbox_casing, value: 1, interpretation: "fillet from that floor up into the well's wall"}
  cas_well_len: {basis: source, from: gearbox_casing, value: 2, interpretation: "well length above the ring gear, its fillet included"}
  cas_mouth_d: {basis: source, from: gearbox_casing, value: 90, interpretation: "diameter the well's cone opens to at the pocket floor"}
  cas_mouth_len: {basis: source, from: gearbox_casing, value: 2.5, interpretation: "length of the cone from the well's wall to the pocket floor"}
  cas_pocket_d: {basis: source, from: gearbox_casing, value: 96.8, interpretation: "diameter of the pocket in the flange face"}
  cas_notch_r: {basis: source, from: gearbox_casing, value: 1.5, interpretation: "radius of each notch in the pocket's wall, centred on the pocket's circle, the first on the file's +x"}
  cas_n_notches: {basis: source, from: gearbox_casing, value: 18, interpretation: "notches in the pocket's wall, evenly spaced"}
  cas_notch_fillet: {basis: source, from: gearbox_casing, value: 3, interpretation: "fillet joining each notch to the pocket's circle"}
  cas_ret_circle_r: {basis: source, from: gearbox_casing, value: 40, interpretation: "radius of the retainer screw holes' circle, the first midway to the next from the file's +x"}
  cas_ret_hole_d: {basis: source, from: gearbox_casing, value: 4, interpretation: "retainer screw hole diameter"}
  cas_ret_hole_depth: {basis: source, from: gearbox_casing, value: 9, interpretation: "retainer screw hole depth from the output end, through its nut slot"}
  cas_n_ret: {basis: source, from: gearbox_casing, value: 6, interpretation: "retainer screw holes, evenly spaced"}
  cas_slot_z: {basis: source, from: gearbox_casing, value: 3, interpretation: "file z of each nut slot's floor"}
  cas_slot_w: {basis: source, from: gearbox_casing, value: 3.2, interpretation: "nut slot width along the axis"}
  cas_slot_af: {basis: source, from: gearbox_casing, value: 7, interpretation: "nut slot across flats, a flat square to the radius; the slot runs out through the casing's side at its width across corners"}

  # ---- bearing retainer: read off its released body --------------------------------------
  ret_axis_z: {basis: source, from: bearing_retainer, value: 44, interpretation: "frame: the ring's axis runs along file y through z = 44"}
  ret_axis_x: {basis: source, from: bearing_retainer, value: 44, interpretation: "frame: the ring's axis runs along file y through x = 44"}
  ret_od: {basis: source, from: bearing_retainer, value: 88, interpretation: "outer diameter"}
  ret_id: {basis: source, from: bearing_retainer, value: 70.5, interpretation: "inner diameter"}
  ret_t: {basis: source, from: bearing_retainer, value: 2, interpretation: "thickness, file y from 0"}
  ret_hole_d: {basis: source, from: bearing_retainer, value: 4, interpretation: "screw hole diameter"}
  ret_hole_circle_r: {basis: source, from: bearing_retainer, value: 40, interpretation: "radius of the screw holes' circle; the first hole lies on the file's +z from the axis"}
  ret_n_holes: {basis: source, from: bearing_retainer, value: 6, interpretation: "screw holes, evenly spaced"}

  # ---- where the settled parts sit: no source states it; each follows from the seats ------
  carrier_z: {basis: derived, expr: cas_seat_depth - car_journal_len, gap: G-carrier-place, interpretation: "height of the carrier's output face above the casing's output end: the journal's shoulder level with the shoulder of the casing's bearing seat, the two faces one bearing sits against"}
  planet_z: {basis: derived, expr: carrier_z + car_journal_len + car_flange_t + car_boss_h, gap: G-planet-place, interpretation: "height of each planet's near end face: level with the top of its post's boss, so a bearing flush in the planet's seat sits on the boss"}
  sun_z: {basis: derived, expr: carrier_z + car_journal_len + car_flange_t - sun_journal_len, gap: G-sun-place, interpretation: "height of the sun's journal end: the journal's shoulder level with the carrier's inner face, where a bearing flush in the carrier's seat ends"}
  sec_z: {basis: derived, expr: carrier_z + car_len - sec_socket_depth, gap: G-sec-carrier-place, interpretation: "height of the secondary carrier's boss faces: its sockets bottomed on the ends of the carrier's posts, bosses towards the planets, the rounded boss on the first post"}
  ret_z: {basis: derived, expr: -ret_t, gap: G-retainer-place, interpretation: "height of the retainer's near face: the ring lies on the casing's output end face, outside it"}
  ret_turn: {basis: derived, expr: 180 / cas_n_ret, gap: G-retainer-place, interpretation: "the retainer's turn about the axis, in degrees, from where its file holds it: its holes over the casing's"}

  # ---- purchased parts no source sizes: proposed from the seats the released bodies give them
  out_brg_bore: {basis: proposed, value: 55, rationale: "deep-groove ball bearing 6811 (61811), 55 x 72 x 9: the catalogue size whose bore is the carrier's 55 journal and whose outside the casing's 72 seat", gap: G-output-bearing}
  out_brg_od: {basis: proposed, value: 72, rationale: "bearing 6811, 55 x 72 x 9: its outside diameter is the casing's seat", gap: G-output-bearing}
  out_brg_w: {basis: proposed, value: 9, rationale: "bearing 6811, 55 x 72 x 9: its width is the seat's 9 depth and the journal's 9 length, so the retainer and the carrier's flange clamp it", gap: G-output-bearing}
  out_brg_mass: {basis: proposed, value: 83, rationale: "bearing 6811: 0.083 kg in the makers' catalogues", gap: G-output-bearing}
  sun_brg_bore: {basis: proposed, value: 8, rationale: "deep-groove ball bearing 688-2Z, 8 x 16 x 5: the catalogue size whose bore is the sun's 8 journal and whose outside the carrier's 16 seat", gap: G-sun-bearing}
  sun_brg_od: {basis: proposed, value: 16, rationale: "bearing 688-2Z, 8 x 16 x 5: its outside diameter is the carrier's seat", gap: G-sun-bearing}
  sun_brg_w: {basis: proposed, value: 5, rationale: "bearing 688-2Z, 8 x 16 x 5: the shielded width, which fills the seat's 5 depth; the open 688 is 4 wide", gap: G-sun-bearing}
  sun_brg_mass: {basis: proposed, value: 4, rationale: "bearing 688-2Z: 4 g in the makers' catalogues", gap: G-sun-bearing}
  planet_brg_bore: {basis: proposed, value: 8, rationale: "miniature ball bearing MR128-2Z, 8 x 12 x 3.5: the catalogue size whose bore is the carrier's 8 post and whose outside the planet's 12 seat", gap: G-planet-bearings}
  planet_brg_od: {basis: proposed, value: 12, rationale: "bearing MR128-2Z, 8 x 12 x 3.5: its outside diameter is the planet's seat", gap: G-planet-bearings}
  planet_brg_w: {basis: proposed, value: 3.5, rationale: "bearing MR128-2Z, 8 x 12 x 3.5: its width is the seat's 3.5 depth", gap: G-planet-bearings}
  planet_brg_mass: {basis: proposed, value: 0.7, rationale: "bearing MR128-2Z: 0.7 g in the makers' catalogues", gap: G-planet-bearings}
  planet_brgs: {basis: proposed, value: 2, rationale: "one bearing in each of a planet's two seats, the near one on the post's boss and the far one under the secondary carrier's boss", gap: G-planet-bearings}

  # ---- screws and nuts no source sizes: proposed from the holes and pockets the bodies give them
  sun_bolt: {basis: proposed, thread: M5, length: sun_bolt_len, rationale: "socket head cap screw ISO 4762 M5: the sun's 5 bore is its shank and the 8.9 x 5 pocket its 8.5 x 5 head", gap: G-sun-bolt}
  sun_bolt_len: {basis: proposed, value: 40, rationale: "the longest standard length that ends inside the carrier's bore: 37.13 of sun and 2.87 standing out of the journal's end, for a thin nut (ISO 4035, 2.7)", gap: G-sun-bolt}
  shaft_bolt: {basis: proposed, thread: M5, length: shaft_bolt_len, rationale: "socket head cap screw ISO 4762 M5 with a hex nut: the carrier's 5.4 holes clear it, the secondary carrier's 5 holes are its shank, and the 9.3 x 5 pockets take its 8.5 x 5 head; the 8.8 nut pockets are loose on its 8 nut", gap: G-planet-shaft-bolts}
  shaft_bolt_len: {basis: proposed, value: 40, rationale: "the shortest standard length through a full nut: 33.13 from the head pocket's floor to the nut pocket's, and 35 would leave the nut 1.87 of thread", gap: G-planet-shaft-bolts}
  ext_bolt: {basis: proposed, thread: M3, length: ext_bolt_len, rationale: "socket head cap screw ISO 4762 M3 with a hex nut: the carrier's 3.4 holes are its clearance, the secondary carrier's 3 holes its shank, and the 6.3 x 3 pockets take its 5.5 x 3 head; the 6.3 nut pockets are loose on its 5.5 nut. The two plates' hole circles differ by 0.75 (conflict K-extrusion-holes)", gap: G-extrusion-bolts}
  ext_bolt_len: {basis: proposed, value: 40, rationale: "the shortest standard length through its nut: 35.13 from the head pocket's floor to the nut pocket's, which 35 does not reach", gap: G-extrusion-bolts}
  ret_screw: {basis: proposed, thread: M4, length: ret_screw_len, rationale: "M4 screw with a hex nut: the casing's side slots, 7 across flats and 3.2 wide, are an M4 nut's 7 x 3.2, and the 4 holes are its shank", gap: G-retainer-screws}
  ret_screw_len: {basis: proposed, value: 10, rationale: "2 of retainer and 8 into the casing's 9 hole, through the whole nut in its slot from 3 to 6.2", gap: G-retainer-screws}
  out_thread: {basis: proposed, thread: M4, rationale: "M4 hex nuts in the output face's pockets: 7 across flats is an M4 nut's, behind 4.4 holes that clear its screw; the screws are the user's, by what is mounted", gap: G-output-nuts}

  # ---- the mass model ----------------------------------------------------------------------
  pla_density: {basis: proposed, value: 0.00124, rationale: "PLA at 1.24 g/cm3, the density filament makers list, for parts printed solid at 100% infill", gap: G-density}
parts:
  sun: {density: pla_density}
  planet: {density: pla_density}
  carrier: {density: pla_density}
  sec_carrier: {density: pla_density}
  gearbox_casing: {density: pla_density}
  bearing_retainer: {density: pla_density}
  output_bearing: {mass: out_brg_mass}
  sun_bearing: {mass: sun_brg_mass}
  planet_bearing: {mass: planet_brg_mass}
