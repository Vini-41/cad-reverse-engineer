# Written by checks_gen.py; edit that and rerun. Expected values come from evidence.yaml, never from params.yaml.
checks:
  # ---- the train: pitch circles, centre distances, planet count, ring outside, extrusion clearance
  - {id: "sun-pitch", kind: "distance", between: ["sun_gear.flank_a", "sun_gear.flank_b"], expect: "T1.module * T1.z_sun", interpretation: "opposite flanks at the pitch radius, half a turn apart"}
  - {id: "planet-pitch", kind: "distance", between: ["planet_gear.flank_a", "planet_gear.flank_b"], expect: "T1.module * T1.z_planet", interpretation: "opposite flanks at the pitch radius, half a turn apart"}
  - {id: "ring-pitch", kind: "distance", between: ["casing.rp_a", "casing.rp_b"], expect: "T1.module * T1.z_ring", interpretation: "opposite flanks of the internal ring at its pitch radius"}
  - {id: "sun-planet", kind: "distance", instances: ["sun_1", "planet_1"], between: ["sun_1.axis_hi", "planet_1.axis"], along: "y", expect: "T1.module * (T1.z_sun + T1.z_planet) / 2", interpretation: "planet 1 sits at 90 deg, so its axis's y is the centre distance"}
  - {id: "ring-planet", kind: "distance", instances: ["casing_1", "planet_1"], between: ["casing_1.axis_lo", "planet_1.axis"], along: "y", expect: "T1.module * (T1.z_ring - T1.z_planet) / 2", interpretation: "the planet axis's distance from the ring axis"}
  - {id: "planets", kind: "count", part: "planet_gear", evidence: "T1", key: "n_planets"}
  - {id: "ring-od", kind: "distance", between: ["casing.nk2", "casing.nk2_b"], expect: "T1.module * T1.z_ring + 2 * DRW.drw", interpretation: "the ring's outside cylinder below the flare: pitch diameter plus twice the stated radial width"}
  - {id: "ext-clear", kind: "distance", between: ["primary_carrier.pin_axis", "primary_carrier.ext_side"], expect: "T1.module * T1.z_planet / 2 + T1.module + DCE.dce", interpretation: "an extrusion's flank from the planet axis: the planet's tip radius (one-module addendum) plus the stated clearance"}
  # ---- motion: the carrier's turn per sun turn, the output of the 7.2:1 train
  - {id: "carrier-turn", kind: "angle", instances: ["casing_1", "carrier_1"], between: ["casing_1.ang_ref", "casing_1.ang_axis", "carrier_1.pin_axis_lo"], from: {}, pose: {"sun": 360}, expect: "360 / R1.ratio", interpretation: "the carrier's pin 1 starts a quarter turn from the casing's reference; one sun turn moves it 50 deg on"}
  - {id: "mesh-clear", kind: "interference", pairs: [["sun_1", "planet_1"], ["sun_1", "planet_2"], ["sun_1", "planet_3"], ["planet_1", "casing_1"], ["planet_2", "casing_1"], ["planet_3", "casing_1"], ["carrier_1", "casing_1"], ["sec_1", "casing_1"], ["planet_1", "carrier_1"], ["planet_1", "sec_1"], ["sun_1", "carrier_1"], ["sun_1", "sec_1"], ["retainer_1", "casing_1"]], max_volume: 0.001}
  # ---- each released body against the part that reproduces it
  - {id: "planet-shape", kind: "shape", part: "planet_gear", body: "planet"}
  - {id: "sun-shape", kind: "shape", part: "sun_gear", body: "sun"}
  - {id: "carrier-shape", kind: "shape", part: "primary_carrier", body: "carrier_updated"}
  - {id: "sec-shape", kind: "shape", part: "secondary_carrier", body: "sec_carrier"}
  - {id: "casing-shape", kind: "shape", part: "casing", body: "gearbox_casing"}
  - {id: "retainer-shape", kind: "shape", part: "retainer", body: "bearing_retainer"}
