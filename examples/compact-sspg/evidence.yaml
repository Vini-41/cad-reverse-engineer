# Places where sources disagree, and how the reconstruction resolves each.
conflicts:
  - id: K-extrusion-holes
    evidence: []
    summary: "Two released bodies disagree: the updated carrier's three extrusion bolt holes stand 23.5 from the axis, the secondary carrier's 24.25, so the plates do not line up on these bolts by 0.75."
    resolution: "Each part is built as its own released body holds it, so each shape check passes and the model shows the mismatch; gap G-extrusion-hole-circle asks the authors which circle is right."
