evidence:
  # ---- the train (Table I) and its ratio
  - id: T1
    source: paper
    page: 7
    locator: "Table I, SSPG (MN8014) row, Stage-1 [Ns1, Np1, Nr1, m1, np1]"
    quote: "Stage-1:[25,65,155,0.5,3]"
    values: {z_sun: 25, z_planet: 65, z_ring: 155, module: 0.5, n_planets: 3}
  - id: T1-order
    source: paper
    page: 7
    locator: "Table I, column header"
    quote: "[N si , Npi , Nri , mi, npi ]"
    scope: context
    reason: "names the order of Table I's entries: sun, planet and ring teeth, module, planet count (read into T1)"
  - id: R1
    source: paper
    page: 2
    locator: "Sec. I, contributions, item 3"
    quote: "an SSPG (MN8014 motor, 7.2:1)"
    values: {ratio: 7.2}
  - id: R1-fig3
    source: paper
    page: 4
    locator: "Fig. 3 caption"
    quote: "(a)SSPG:7.2:1, Motor:"
    values: {ratio: 7.2}
    scope: context
    reason: "restates R1"
  - id: R1-fig4
    source: paper
    page: 5
    locator: "Fig. 4(a) label"
    image: figures/crops/fig4a-label.png
    image_sha256: 81703addd8653c360dfdb3058f3071f06ec1406c1551ba1265d66bac72c6662e
    reading: "(a) SSPG (MN8014, 7.2:1)"
    values: {ratio: 7.2}
    scope: context
    reason: "restates R1"
    confirmed_by: Vini Rezanejad
  - id: TRAIN
    source: paper
    page: 2
    locator: "Sec. II-A"
    quote: "has the ring gear fixed, the sun gear driven by the motor, and the carrier providing the output"
    scope: context
    reason: "the train's fixed member (ring), input (sun) and output (carrier): the joints and gears in model.py"
  - id: TRAIN-fig2
    source: paper
    page: 2
    locator: "Fig. 2 caption, SSPG"
    quote: "SSPG:Sun (S) input, Ring (R) fixed, Carrier (C) output."
    scope: context
    reason: "restates TRAIN"
  - id: EQ1
    source: paper
    page: 2
    locator: "Eq. (1)"
    quote: "the carrier (output) shaft"
    scope: context
    reason: "Eq. (1), G = (Ns1 + Nr1) / Ns1 = omega_s / omega_c, is the carrier_ratio param's formula (its text extracts garbled, so this locates it)"
  - id: GEOM
    source: paper
    page: 3
    locator: "Sec. III-B, constraint II, Eq. (12)"
    quote: "SSPG/DSPG:N ri =N si + 2Npi"
    scope: context
    reason: "the ring's tooth count from the sun's and planet's, which T1 meets (155 = 25 + 2 x 65); the pitch and centre-distance checks confirm it on the model"
  # ---- design constants the released carrier and ring realise
  - id: DCE
    source: paper
    page: 4
    locator: "Sec. III-B, constraint IV"
    quote: "δ ce = 1mm is the minimum clearance to avoid interference"
    values: {dce: 1}
  - id: RCE
    source: paper
    page: 4
    locator: "Sec. III-B, constraint IV"
    quote: "R ce = 4mm is the carrier extrusion radius"
    values: {rce: 4}
    scope: context
    reason: "the optimiser's model of each carrier extrusion as a 4 mm-radius rod; the released carrier's extrusions are lobes bounded by the planets' clearance circles (probed), and no 4 mm radius of an extrusion is built"
  - id: DRW
    source: paper
    page: 4
    locator: "Sec. III-B, constraint V"
    quote: "δ rw is the radial width of the ring gear (taken as 5mm in this work)"
    values: {drw: 5}
