# Places where sources disagree, and how the reconstruction resolves each.
conflicts:
  - id: K-dot
    evidence: [T633-dot, F169-dot]
    summary: "Table 633 gives the pin 1 dot Coord. X 0.5 and Coord. Y 6 from the package's bottom-left corner, with a height and a width of 0.5. Figure 169 draws the dot about 0.55 across, its centre about 0.60 from the left side and 6.43 from the bottom side (scaled against its 7 mm outline). That is neither the table's point read as the dot's centre (0.5, 6) nor read as the lower left of its box (centre 0.75, 6.25)."
    resolution: "The table is built from: it states the numbers, and Figure 169 sketches the layout without holding to them (its text lines are off the table's coordinates too). The dot is built 0.5 across with the table's point at the lower left of its box, the reading nearer the figure and the one the table's text lines follow; G-dot-origin asks the authors which is meant."
