    scope: context
    reason: "the land pattern the package stands on, which gives the model its frame; its lands' sizes are the board's and are skipped. It marks no origin and no pin 1: its two centrelines cross at the middle of the centre land, and every dimension is symmetric about them, so the origin is that crossing, the package's centre; pin 1 is F3-pinout's. Each row of 14 lands spans 5.40 about a centreline at the 0.40 pitch (restates F167-e), so the rows of leads are centred too"

