# Every number the sources state about the object. Each item is a verbatim quote or a pinned
# figure crop with its reading.
#
# Figure 167 (page 584) is a vector drawing whose labels are not in the text `cadrev text` prints, so its
# dimension table and its three views are image evidence. The table's rows are ledgered one by one off
# one crop, fig167-mm.png, which keeps the Symbol / Min. / Nom. / Max. header over each row.
evidence:
  # ---- what the text states -------------------------------------------------------------------
  - id: P13-size
    source: datasheet
    page: 13
    locator: Figure 3, caption
    quote: "RP2040 Pinout for QFN-56 7×7 mm (reduced ePad size)"
    values: {D: 7, E: 7}

  - id: T632-caption
    source: datasheet
    page: 585
    locator: Table 632, caption
    quote: "Thermal data for the {chipname} QFN 56 package."
    values: {leads: 56}

  - id: P584-caption
    source: datasheet
    page: 584
    locator: Figure 167, caption
    quote: "Top down view (left, top) and side view (right, top), along with bottom view (left, bottom) of the RP2040 QFN-56 package"
    scope: context
    reason: "restates T632-caption.leads; names Figure 167's three views: top view upper left, side view upper right, bottom view lower left"

  - id: P584-epad
    source: datasheet
    page: 584
    locator: Note under Figure 167
    quote: "There is no standard size for the central GND pad (or ePad) with QFNs. However, the one on RP2040 is smaller than most. This means that standard 0.4 mm QFN-56 footprints provided with CAD tools may need adjusting."
    scope: context
    reason: "restates F167-e: 0.4 mm is the lead pitch of the standard footprint this package takes; says the centre pad is smaller than the usual one, with no size"

  - id: P585-plating
    source: datasheet
    page: 585
    locator: Note above 5.1.1
    quote: "Leads have a matte Tin (Sn) finish. Annealing is done post-plating, baking at 150°C for 1 hour. Minimum thickness for lead plating is 8 micromns, and the intermediate layer material is CuFe2P (roughened Copper (Cu))."
    values: {plating_min: 8}
    scope: not-modeled
    reason: "the leads' tin plating, at least 8 micrometres thick (printed 'micromns'), is a surface finish inside the stated lead dimensions and is not built as a layer; the lead frame under it is CuFe2P copper"

  - id: P585-size
    source: datasheet
