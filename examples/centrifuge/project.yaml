# Reconstruction project. File formats: references/project-format.md in the build-model skill.
format: 2   # version of these file formats; set by cadrev init
name: "mini-centrifuge"
target: "Open-source mini benchtop centrifuge of Poór 2022 (HardwareX 12, e00328) as reported, static and unloaded: the standard Centrifuge body for the 116 mm lid (not the compatibility body) printed as one object (no Arrows inlay), the Bottom plate, the six-tube Rotor - 32.5 mm fixed on the fan hub (not the 36.6 mm or PCR strip rotors, no fit tester), with the lid, 80 mm fan, lid switch, main switch and DC socket; no tubes, tube adapters or power supply"
units: {length: mm, angle: deg, mass: g}
material: "PLA, FDM printed"
follows: design
up: y                   # the released bodies stand along +y: the body's deck is its top face, at y = 0
tolerance: {length: 0.001}   # how closely the model realises a source value; no shop works to it
clearance: fit_gap      # the loosest fit: a bought part pushed into its printed opening
