# Places where sources disagree, and how the reconstruction resolves each.
conflicts:
  - id: K-body-infill
    evidence: [P7-body-infill, fig8-profile]
    summary: The text says the body was printed with 10% infill; Fig. 8's Cura window slices it at 100% infill.
    resolution: Fig. 8 shows the print orientation, sliced at the profile's 100 %, so its 121 g is the solid body's mass (the released body is 97.79 cm³, and 121 g over it is 1.237 g/cm³, a PLA's density) and is compared with the solid model. The body as printed at 10 % infill is lighter, and no source states that mass.

  - id: K-rotor-mass
    evidence: [P11-rotor-mass, fig8-body-print]
    summary: The rotor is stated at 16 g and printed solid. The released Rotor - 32.5 mm is 10.60 cm³, which at the 1.237 g/cm³ Fig. 8 implies for the body weighs 13.1 g, 18 % under. The released Rotor - PCR strip - 32.5 mm (12.92 cm³) weighs 16.0 g at it.
    resolution: The rotor is built from the released Rotor - 32.5 mm, the target's, and its shape check holds it to that body. A mass check of it against the 16 g, at the half gram the statement is printed to, fails (13.15 g at 1.24 g/cm³, 2.85 g under), so the 16 g is kept as context and no check compares it. Whether the 16 g is the PCR strip rotor's, which it matches, is a question for the author.

  - id: K-lid-switch-axes
    evidence: [B-lid-switch]
    summary: The bill of materials gives the lid switch two sizes, 6*9 mm, without saying which of its dimensions they are. The body's pocket for it is 6 by 12 mm in plan. Either the 9 mm is the switch's height, standing in the pocket, with its length along the pocket's 12 mm unstated; or the 9 mm is its length, loose in the pocket's 12 mm, with its height unstated.
    resolution: Built with the 6 mm across the pocket's 6 mm and the 9 mm as the height, and the length along the pocket's 12 mm derived from the pocket. Gap G-lid-switch asks which two dimensions the 6 and 9 mm are.
