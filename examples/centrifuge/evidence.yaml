conflicts:
  - {"id": "K1", "evidence": ["P3-pcr366-row", "P7-hub-sizes"], "summary": "The design-file table describes the 36.6 mm PCR-strip rotor as for fans 'with 32.5 mm hub diameter'; its name and §5.1.1 give 36.6 mm.", "resolution": "A copy error in the 36.6 mm row, which concerns the variant not modelled. The modelled 32.5 mm PCR-strip rotor's own row (P3-pcr325) and its released body (R-hub-bore) agree on 32.5 mm."}
  - {"id": "K2", "evidence": ["P3-main-switch", "B-rocker-w"], "summary": "The rocker switch is listed as 19*12.5 mm; the body's cut-out for it is 19 x 13 mm.", "resolution": "Different objects: 12.5 mm is the purchased switch (not built), 13 mm the cut-out that clears it. The model takes the cut-out from the released body."}
  - {"id": "K3", "evidence": ["P3-lid-switch", "B-slot-len"], "summary": "The lid micro switch is listed as 6*9 mm; the body's slot for it is 6 x 12 mm.", "resolution": "Different objects: the slot holds the switch and leaves room for its lever. The model takes the slot from the released body."}
