# Places where sources disagree, and how the reconstruction resolves each.
conflicts:
  - id: K1
    evidence: [S2-bent-linkage, L14-design]
    summary: Table S2 bent linkage L = 37 and Sec. 4.2 L14 = 37 may name different measures (envelope vs pin pitch) or different links.
  - id: K2
    evidence: [mass-420, mass-430]
    summary: Mechanism mass is 420 g in the conclusion and about 430 g in methods.
    resolution: Neither is used; no mass check in this example.
