# Every number the sources state about the object. Each item is a verbatim quote
# (text sources) or a pinned figure crop with its reading (figures, video frames).
evidence:
  # Table S2 gives L x H x W envelopes with no datums.
  - id: S2-compression-linkage
    source: supp
    locator: Table S2
    quote: "Compression Linkage 40×8×5"
    values: {L: 40, H: 8, W: 5}
  - id: S2-bent-linkage
    source: supp
    locator: Table S2
    quote: "Bent Linkage 37×6.5×5"
    values: {L: 37, H: 6.5, W: 5}
  - id: S2-linkage
    source: supp
    locator: Table S2
    quote: "Linkage 31×4×3"
    values: {L: 31, H: 4, W: 3}
  - id: S2-other-parts
    source: supp
    locator: Table S2
    quote: "Pedestal 16×16×63 Bent Linkage 37×6.5×5 Claw 25×8×18 Phalanx 1 24×12×18 Phalanx 2 24×12×18 Linkage 31×4×3 Thigh 92.5×39×44 Steering Wheel 18×5×18"
    values: {pedestal_L: 16, claw_L: 25, phalanx_L: 24, thigh_L: 92.5, wheel_L: 18}
    scope: not-modeled
    reason: This example models only the three linkages.

  - id: L14-design
    source: paper
    page: 11
    locator: Sec. 4.2
    quote: "L14 was determined to be no less than 37 mm, and a design value of 37 mm was therefore adopted."
    values: {L14: 37}
    scope: context
    reason: Linkage 2 is not identified with a Table S2 part, and L14 is a kinematic length, not an envelope (conflict K1).

  - id: fig2a-foot-sole
    source: paper
    page: 4
    locator: Fig. 2A, sole of the foot inset
    image: figures/crops/fig2a-foot-sole.png
    image_sha256: 6b92c7bfb89a2183dd48ec68a65297e7dd5ba34c7bcafc47813028ac5fc3cedc
    reading: "70mm; 56mm; 22mm"
    values: {L: 70, W: 56, H: 22}
    scope: not-modeled
    reason: Foot not modeled in this example; Figure S1 gives a different 60 x 46 x 20 schematic.

  - id: tension-springs
    source: paper
    page: 11
    locator: Sec. 4.1
    quote: "Eight tension springs (4 mm diameter, 0.4 mm wire diameter, 15 mm length)"
    values: {d: 4, wire: 0.4, length: 15}
    scope: not-modeled
    reason: Springs are purchased parts; not modeled in this example.
  - id: torsion-springs
    source: paper
    page: 11
    locator: Sec. 4.1
    quote: "torsion springs (0.7 mm wire diameter, 4 mm diameter, six turns, preset at 45◦)"
    values: {wire: 0.7, d: 4, preset: 45}
    scope: not-modeled
    reason: Springs are purchased parts; not modeled in this example.
  - id: tendons
    source: paper
    page: 11
    locator: Sec. 4.1
    quote: "with Kevlar (0.5 mm, Dupont) selected for the passive tendons due to its high tensile strength and low elongation, and Dyneema (0.35 mm, Beadalon)"
    values: {passive: 0.5, active: 0.35}
    scope: not-modeled
    reason: Tendons are not solid geometry.
  - id: mass-420
    source: paper
    page: 10
    locator: Sec. 3 conclusion
    quote: "weighing 420 g"
    values: {mass: 420}
    scope: context
    reason: Whole-mechanism mass; conflicts with 430 g (K2).
  - id: mass-430
    source: paper
    page: 11
    locator: Sec. 4.1
    quote: "The mechanism weighs approximately 430 g"
    values: {mass: 430}
    scope: context
    reason: Whole-mechanism mass; conflicts with 420 g (K2).

