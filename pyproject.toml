[project]
name = "cadrev"
version = "0.3.0"
description = "Reverse-engineer CAD from a paper, with every dimension traceable to a quoted source."
readme = "plugin/README.md"
license = "MIT"
# One resolution: every Python in this range installs the versions scripts/check runs.
requires-python = ">=3.12,<3.15"
dependencies = [
    "build123d==0.13.0",
    "pyyaml==6.0.3",
    # Reads a PDF's text, renders its pages and extracts its images: PDFium, under a permissive
    # license. Quotes are matched against the text it extracts, so a new major is taken on purpose.
    "pypdfium2==5.15.2",
    # The drawings, and the plots a run's own scripts draw (`cadrev python`).
    "matplotlib==3.11.2",
    # MuJoCo's bindings without its viewer: the kinematics motion.py poses a mechanism with.
    "mujoco-core==4.0.1",
    # Imported by name, though build123d and matplotlib bring them in too: distance.py's and
    # motion.py's arrays, a shape check's nearest-sample bound, `cadrev crop` and `figures`.
    "numpy==2.5.4",
    "scipy==1.18.1",
    "pillow==13.0.0",
    # A cut file's SVG: svgelements reads it, ocpsvg turns its contours into wires.
    "ocpsvg==0.7.0",
    "svgelements==1.9.6",
    # What those bring in, OCC among them. uvx reads no lockfile, so these pins are what give
    # every user the versions the checks ran on: the lock's runtime packages, held by a test.
    "anytree==2.13.0",
    "asttokens==3.0.2",
    "bd-materials==0.2.4",
    "cadquery-ocp-novtk==8.0.1.1.0",
    "cadquery-ocp-proxy==8.0.1.1.0",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.2",
    "cloudpickle==3.1.2",
    "colorama==0.4.6 ; sys_platform == 'win32'",
    "contourpy==1.4.0",
    "cycler==0.12.1",
    "dataclasses-json==0.6.7",
    "deprecated==3.0.0",
    "executing==2.3.0",
    "ezdxf==1.4.5",
    "fonttools==4.67.0",
    "idna==3.20",
    "ipython==9.17.1",
    "ipython-pygments-lexers==1.1.1",
    "jedi==0.20.1",
    "joblib==1.6.0",
    "kiwisolver==1.5.1",
    "lib3mf==2.5.0 ; platform_machine != 'aarch64' or sys_platform != 'linux'",
    "marshmallow==3.26.2",
    "matplotlib-inline==0.2.2",
    "mpmath==1.3.0",
    "mypy-extensions==1.1.0",
    "narwhals==2.27.1",
    "ocp-gordon==0.3.1",
    "packaging==26.3",
    "parso==0.8.7",
    "pexpect==4.9.0 ; sys_platform != 'emscripten' and sys_platform != 'win32'",
    "platformdirs==4.13.4",
    "prompt-toolkit==3.0.53",
    "psutil==7.2.2 ; sys_platform != 'cygwin' and sys_platform != 'emscripten'",
    "ptyprocess==0.7.0 ; sys_platform != 'emscripten' and sys_platform != 'win32'",
    "pure-eval==0.2.4",
    "py-lib3mf==2.5.0 ; platform_machine == 'aarch64' and sys_platform == 'linux'",
    "pygltflib==1.16.5",
    "pygments==2.21.0",
    "pyparsing==3.3.3",
    "python-dateutil==2.9.0.post0",
    "requests==2.34.2",
    "scikit-learn==1.9.1",
    "six==1.17.0",
    "stack-data==0.6.3",
    "svgpathtools==1.8.0",
    "svgwrite==1.4.3",
    "sympy==1.14.0",
    "threadpoolctl==3.7.0",
    "threejs-materials==1.2.5",
    "traitlets==5.16.1",
    "trianglesolver==1.2",
    "typing-extensions==4.16.0",
    "typing-inspect==0.9.0",
    "urllib3==2.8.0",
    "wcwidth==0.9.2",
    "webcolors==24.8.0",
    "wrapt==2.5.1",
]

[project.scripts]
cadrev = "cadrev.cli:main"

[project.urls]
Repository = "https://github.com/Vini-41/cad-reverse-engineer"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8",
    "pytest-xdist>=3",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadrev"]

[tool.hatch.build.targets.sdist]
include = ["src", "plugin/README.md"]
