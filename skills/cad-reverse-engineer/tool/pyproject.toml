[project]
name = "cadrev"
version = "0.1.0"
description = "Reverse-engineer CAD from a paper, with every dimension traceable to a quoted source."
license = "MIT"
requires-python = ">=3.10,<3.14"
dependencies = [
    "build123d>=0.9",
    "pyyaml>=6",
    "pypdf>=4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = [
    "pyright>=1.1.414",
    "pytest>=8",
    "ruff>=0.17.1",
]

[project.scripts]
cadrev = "cadrev.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadrev"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/cadrev/template"]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pyflakes and pycodestyle errors, blind excepts (each one carries a noqa with its reason), and
# syntax the oldest Python in requires-python cannot parse.
select = ["E4", "E7", "E9", "F", "BLE", "UP"]
