[project]
name = "cadrev"
version = "0.1.0"
description = "Reverse-engineer CAD from a paper, with every dimension traceable to a quoted source."
license = "MIT"
requires-python = ">=3.10,<3.14"
dependencies = [
    "build123d>=0.9",
    "pyyaml>=6",
    "pypdf>=4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cadrev = "cadrev.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadrev"]
