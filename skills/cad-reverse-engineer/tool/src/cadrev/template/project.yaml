# Reconstruction project. File formats: references/project-format.md in the cad-reverse-engineer skill.
format: 1   # version of these file formats; set by cadrev init
name: NAME
target: TODO one sentence naming the object, version and configuration being reconstructed
units: {length: mm, angle: deg, mass: g}
tolerance: {length: 0.001}   # model must realise source values to this; it is not a print tolerance
# Register sources with `cadrev source`; it copies the file and pins its sha256. Keep this key last.
sources: []
